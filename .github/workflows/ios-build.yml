name: iOS Build (远程构建)

# Windows 上只需 git push，此工作流在 GitHub 云端 Mac 上完成 Xcode 编译，
# 编译产物（.app）回传到 Actions 页面的 Artifacts 可下载。
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['ios/**']
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: macos-15          # Apple Silicon 云 Mac，预装 Xcode 16.x
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 打印环境信息
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      - name: 编译（iOS 模拟器目标，免签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/GuwenApp.xcodeproj \
            -scheme GuwenApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: 编译结果摘要
        if: always()
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/GuwenApp.app"
          if [ -d "$APP" ]; then
            echo "✅ 编译成功：$APP"
            ls -la "$APP"
          else
            echo "❌ 编译失败，产物不存在"
            exit 1
          fi

      # 编译通过 ≠ 能跑起来。这一步真的把 App 装进 iPhone 模拟器启动，
      # 截图存证并检查进程存活——顺带验证首次启动的 jsonl → SwiftData 导入没崩。
      - name: 冒烟测试（装进模拟器启动 + 截图）
        run: |
          set -euo pipefail
          DEV=$(xcrun simctl list devices available \
                | grep -E "^ +iPhone 1[5-9] \(" | head -1 \
                | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "模拟器设备: $DEV"
          if [ -z "$DEV" ]; then
            echo "❌ 没找到可用的 iPhone 模拟器，现有设备列表："
            xcrun simctl list devices available | head -40
            exit 1
          fi
          xcrun simctl boot "$DEV" 2>/dev/null || true
          xcrun simctl bootstatus "$DEV" -b

          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/GuwenApp.app
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.guwen.flashcards
          sleep 15

          xcrun simctl io "$DEV" screenshot smoke-home.png
          ls -la smoke-home.png

          if xcrun simctl spawn "$DEV" launchctl list | grep -q com.guwen.flashcards; then
            echo "✅ App 启动后进程存活（未崩溃）"
          else
            echo "❌ App 启动后进程已退出，抓崩溃日志："
            find ~/Library/Logs/CoreSimulator/"$DEV" -name "*.ips" -newermt "-10 minutes" \
              -exec sh -c 'echo "--- {} ---"; head -60 "{}"' \; || true
            exit 1
          fi

          # 首次启动导入是否落盘（SwiftData store 非空）
          DATA=$(xcrun simctl get_app_container "$DEV" com.guwen.flashcards data)
          echo "数据容器: $DATA"
          find "$DATA" -name "*.store*" -exec ls -la {} \;

      # 真点一遍四页：选择题 → 答案 → 默写 → 错题本（ui_spec 验收项「四个页面都能导航到」）
      - name: UI 冒烟测试（四页导航）
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/GuwenApp.xcodeproj \
            -scheme GuwenApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: GuwenApp-simulator-build
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/GuwenApp.app
            smoke-home.png
          retention-days: 14
          if-no-files-found: error
