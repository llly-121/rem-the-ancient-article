name: iOS Build (远程构建)

# Windows 上只需 git push，此工作流在 GitHub 云端 Mac 上完成三件事：
#   1. Xcode 编译（验收：无 error）
#   2. 装进 iPhone 模拟器启动并截图（验收：能跑起来、数据导入成功）
#   3. XCUITest 真点一遍四页（验收：四个页面都能导航到）
on:
  push:
    branches: [main]
    # 只列真正影响编译与测试的路径。注意不能同时用 paths 和 paths-ignore，
    # 所以这里不写 `ios/**`（那会把 screenshots/ 和 README 也算进来，白跑一轮 15 分钟）。
    paths:
      - 'ios/GuwenApp/**'
      - 'ios/GuwenAppUITests/**'
      - 'ios/GuwenApp.xcodeproj/**'
      - 'scripts/check_static_acceptance.py'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/GuwenApp/**'
      - 'ios/GuwenAppUITests/**'
      - 'ios/GuwenApp.xcodeproj/**'
      - 'scripts/check_static_acceptance.py'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  build:
    runs-on: macos-15          # Apple Silicon 云 Mac
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 打印环境信息
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphonesimulator

      # 不同批次的分机镜像差异很大：有的预装 iOS 模拟器，有的一个都没有。
      # 这一步负责把「能用的 iPhone 模拟器」准备好，UDID 写进 $GITHUB_ENV 供后续步骤使用。
      - name: 准备 iOS 模拟器
        run: |
          set -euo pipefail
          pick() {
            xcrun simctl list devices available 2>/dev/null \
              | grep -E "^ +iPhone" | head -1 \
              | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true
          }

          UDID=$(pick)
          if [ -z "$UDID" ]; then
            echo "镜像里没有可用设备，先尝试下载 iOS 运行时（数 GB，耗时约 5-10 分钟）"
            xcodebuild -downloadPlatform iOS || true
            UDID=$(pick)
          fi

          if [ -z "$UDID" ]; then
            RT=$(xcrun simctl list runtimes 2>/dev/null \
                 | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+" | head -1 || true)
            DT=$(xcrun simctl list devicetypes 2>/dev/null \
                 | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-[0-9A-Za-z]+" | head -1 || true)
            if [ -n "$RT" ] && [ -n "$DT" ]; then
              echo "用运行时 $RT / 机型 $DT 新建一台模拟器"
              UDID=$(xcrun simctl create "CI iPhone" "$DT" "$RT")
            fi
          fi

          if [ -z "$UDID" ]; then
            echo "❌ 仍然没有可用模拟器，当前环境："
            xcrun simctl list runtimes || true
            xcrun simctl list devices available || true
            exit 1
          fi

          echo "选定模拟器 UDID: $UDID"
          xcrun simctl list devices available | grep "$UDID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # 静态验收：U13（插图全代码绘制 / 完全离线）+ 深色模式无硬编码色。
      # 这三项本质是「代码里不存在某类东西」，跑 UI 反而测不出来；
      # 放在编译前，出问题几秒就红，不用等编译和模拟器。
      - name: 静态验收（U13 / 深色模式）
        run: python3 scripts/check_static_acceptance.py

      # 编译用 generic 目标：不绑定具体机型，避免镜像缺设备时整步失败
      - name: 编译（iOS 模拟器，免签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/GuwenApp.xcodeproj \
            -scheme GuwenApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: 编译结果摘要
        if: always()
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/GuwenApp.app"
          if [ -d "$APP" ]; then
            echo "✅ 编译成功：$APP"
            ls -la "$APP"
          else
            echo "❌ 编译失败，产物不存在"
            exit 1
          fi

      # 编译通过 ≠ 能跑起来。这一步真的把 App 装进 iPhone 模拟器启动，
      # 截图存证并检查进程存活——顺带验证首次启动的 jsonl → SwiftData 导入没崩。
      - name: 冒烟测试（装进模拟器启动 + 截图）
        run: |
          set -euo pipefail
          DEV="$SIM_UDID"
          xcrun simctl boot "$DEV" 2>/dev/null || true
          xcrun simctl bootstatus "$DEV" -b

          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/GuwenApp.app
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.guwen.flashcards
          sleep 15

          xcrun simctl io "$DEV" screenshot smoke-home.png
          ls -la smoke-home.png

          # 注意：不能写 launchctl list | grep -q，grep 提前退出会让 simctl 收到 SIGPIPE 被误判为崩溃
          RUNNING=$(xcrun simctl spawn "$DEV" launchctl list 2>/dev/null || true)
          if echo "$RUNNING" | grep -q "com.guwen.flashcards"; then
            echo "✅ App 启动后进程存活（未崩溃）"
          else
            echo "❌ App 启动后进程已退出，抓崩溃日志："
            find ~/Library/Logs/CoreSimulator/"$DEV" -name "*.ips" -newermt "-10 minutes" \
              -exec sh -c 'echo "--- {} ---"; head -60 "{}"' \; || true
            exit 1
          fi

          # 首次启动导入是否落盘（SwiftData store 非空）
          DATA=$(xcrun simctl get_app_container "$DEV" com.guwen.flashcards data)
          echo "数据容器: $DATA"
          find "$DATA" -name "*.store*" -exec ls -la {} \;

      # 真点一遍：四页导航冒烟 + ui_spec U1–U12 验收
      # （NavigationSmokeTests 走通四页；UAcceptanceTests 断言进度条/防连点/下划线/分句/默写对比/错题本）
      - name: UI 测试（四页导航 + U1–U12 验收）
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/GuwenApp.xcodeproj \
            -scheme GuwenApp \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      # 无论成败都把测试过程中截的图导出来——成功时它就是四页界面的存证
      - name: 导出 UI 测试现场截图
        if: always()
        run: |
          mkdir -p build/attachments
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/TestResults.xcresult \
              --output-path build/attachments || true
          fi
          ls -la build/attachments || true

      - name: 上传编译产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuwenApp-simulator-build
          path: |
            build/DerivedData/Build/Products/Debug-iphonesimulator/GuwenApp.app
            smoke-home.png
            build/attachments
          retention-days: 14
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────
  # 真机安装包（未签名 .ipa）
  #
  # 为什么是「未签名」：iOS 的安装包必须带苹果签发的签名与描述文件，
  # 而签名需要一个 Apple 开发者身份（免费 Apple ID 也行，但要由工具在
  # 本机向苹果申请证书）。这台云端 Mac 上没有、也不该有你的 Apple ID，
  # 所以这里只负责「编出真机架构的 .app 并打成标准 .ipa 结构」，
  # 签名留给你在 Windows 上用 Sideloadly / AltStore 完成 —— 那一步会用
  # 你自己的 Apple ID 现场签，证书私钥始终不离开你本机。
  # ─────────────────────────────────────────────────────────────
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 打印环境信息
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iphoneos"

      # 真机架构（arm64）编译，全程关闭签名：CODE_SIGNING_ALLOWED=NO 是关键，
      # 否则 xcodebuild 会因为 DEVELOPMENT_TEAM 为空直接报 "Signing for GuwenApp requires a development team"
      - name: 编译（真机 arm64，Release，免签名）
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/GuwenApp.xcodeproj \
            -scheme GuwenApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      # .ipa 的本质就是一个 zip，里面必须是 Payload/AppName.app 这个固定结构，
      # 名字和层级错一个 Sideloadly 就会报 "not a valid IPA"
      - name: 打成 .ipa
        run: |
          set -euo pipefail
          APP=build/Device/Build/Products/Release-iphoneos/GuwenApp.app
          if [ ! -d "$APP" ]; then
            echo "❌ 真机产物不存在：$APP"
            ls -la build/Device/Build/Products/ || true
            exit 1
          fi
          echo "产物内容："
          ls -la "$APP"

          # 校验架构必须是 arm64（设备架构），不是 arm64-simulator
          echo "可执行文件架构："
          lipo -info "$APP/GuwenApp" || true

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry GuwenApp-unsigned.ipa Payload
          cd ..
          ls -la build/GuwenApp-unsigned.ipa

          # 自检：包内路径必须是 Payload/GuwenApp.app/GuwenApp
          unzip -l build/GuwenApp-unsigned.ipa | head -20
          if ! unzip -l build/GuwenApp-unsigned.ipa | grep -q "Payload/GuwenApp.app/GuwenApp"; then
            echo "❌ 包结构不对，缺少 Payload/GuwenApp.app/GuwenApp"
            exit 1
          fi
          echo "✅ IPA 结构校验通过"

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: GuwenApp-unsigned-ipa
          path: build/GuwenApp-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
