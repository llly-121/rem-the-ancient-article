<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5E6D3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A211A">
<title>古文英译刷词</title>

<!-- 装到手机主屏：iOS 只认 apple-* 这几条，W3C 的 manifest 它只读一部分。
     缺 apple-mobile-web-app-capable 的话，加进去的只是网址书签，
     点开还会带上 Safari 的地址栏和工具栏，不像个 App。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="古文刷词">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* ─────────────────────────────────────────────────────────────
   设计令牌：与 ios/GuwenApp/Theme.swift 一一对应
   浅色 #F5E6D3 …  深色 #2A211A …
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme: light dark;
  --bg:#F5E6D3; --surface:#FFFBF4; --accent:#C97B4A;
  --text-1:#3E2C1E; --text-2:#7A6552; --error:#8B7A8B; --divider:#E3D3BF;
  --hl:rgba(201,123,74,.25);
  --radius:16px; --pad:20px;
  --serif-cn:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --serif-en:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#2A211A; --surface:#3A2E24; --accent:#D99462;
    --text-1:#F0E4D4; --text-2:#B5A08C; --error:#A892A8; --divider:#4A3B2E;
    --hl:rgba(217,148,98,.25);
  }
}
/* 手动强制外观（首页 ⋯ 菜单可切），特异性高于上面的媒体查询 */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F5E6D3; --surface:#FFFBF4; --accent:#C97B4A;
  --text-1:#3E2C1E; --text-2:#7A6552; --error:#8B7A8B; --divider:#E3D3BF;
  --hl:rgba(201,123,74,.25);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2A211A; --surface:#3A2E24; --accent:#D99462;
  --text-1:#F0E4D4; --text-2:#B5A08C; --error:#A892A8; --divider:#4A3B2E;
  --hl:rgba(217,148,98,.25);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#1a1512;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);
  overflow:hidden;
}
@media (prefers-color-scheme: dark){ body{background:#0e0b09} }

/* 桌面下伪装成手机；窄屏下铺满 */
#phone{
  position:relative;width:390px;height:844px;max-height:100vh;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
  transition:background .2s;
}
@media (min-width:560px) and (min-height:900px){
  #phone{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 10px #2b2320,0 0 0 11px #4a3f38}
}

/* 从主屏图标进入（standalone）：不再是「桌面上的手机模型」，
   而是铺满全屏的真 App，所以要去掉衬底与圆角，并按刘海/底部横条留安全区。
   display-mode 在 iOS Safari 里认，Android Chrome 也认。 */
@media (display-mode: standalone){
  body{background:var(--bg)}
  #phone{
    width:100%;height:100vh;height:100dvh;max-height:none;
    border-radius:0;box-shadow:none;
  }
  .navbar{padding-top:calc(14px + env(safe-area-inset-top))}
  .actionbar{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .tabbar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}

/* ── 通用 ── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:24px var(--pad) 32px}
.stack{display:flex;flex-direction:column}

/* 导航条 */
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--pad) 8px;font-size:13px;color:var(--text-2);flex:none;
}
.navbar b{font-weight:400}
.nav-btn{background:none;border:0;color:var(--text-2);font-size:13px;padding:4px;cursor:pointer;font-family:inherit}
.nav-btn:active{opacity:.5}

/* 进度条 20 段 */
.segbar{display:flex;gap:4px;padding:6px var(--pad) 8px;flex:none}
.segbar i{width:12px;height:6px;border-radius:2px;background:var(--divider);flex:none}
.segbar i.on{background:var(--accent)}

/* 题面 */
.stem{
  font-family:var(--serif-cn);font-size:28px;line-height:1.75;
  color:var(--text-1);text-align:center;padding:12px 0;
}
.stem.left{text-align:left;font-size:26px;line-height:1.7}
.term-u{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
.hint-line{font-size:13px;color:var(--text-2);text-align:center;margin-bottom:2px}

/* 选项 */
.opt{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:14px 16px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--divider);color:var(--text-1);font-size:16px;
  font-family:inherit;line-height:1.45;cursor:pointer;transition:border-color .15s,opacity .15s;
  margin-bottom:12px;
}
.opt span.t{flex:1}
.opt.sel{border-color:var(--accent);border-width:1.5px}
.opt.correct{border-color:var(--accent);border-width:1.5px}
.opt.wrong{border-color:var(--error);border-width:1.5px}
.opt.dim{opacity:.6}
.opt .mk{font-size:15px;flex:none;line-height:1}
.opt .mk.ok{color:var(--accent)}
.opt .mk.no{color:var(--error)}

/* 英译区 */
.en{font-family:var(--serif-en);font-size:17px;line-height:1.55;color:var(--text-1)}
.en .hl{background:var(--hl);border-radius:2px}
.en-block{padding:8px 10px;background:var(--hl);border-radius:8px}
.en-lines{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.en-lines p{margin:0;padding:6px;background:var(--hl);border-radius:6px;font-family:var(--serif-en);font-size:17px;line-height:1.55}

/* 信息卡 */
.card{background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.badge{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;border:1px solid var(--accent);background:rgba(201,123,74,.10);color:var(--text-1)}
.badge.w{border-radius:4px}
.badge.s{border-radius:50%}
.row{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text-1)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:13px;color:var(--text-2)}
.kv .v{font-size:16px;color:var(--text-1)}
.src{font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
.src p{margin:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src p.open{white-space:normal}

/* 按钮 */
.btn-fill,.btn-line{
  flex:1;min-height:44px;border-radius:12px;font-size:16px;font-family:inherit;
  cursor:pointer;border:1px solid transparent;padding:0 12px;
}
.btn-fill{background:var(--accent);color:var(--bg);font-weight:500}
.btn-fill:disabled{background:var(--divider);color:var(--text-2);cursor:default}
.btn-line{background:var(--surface);color:var(--text-1);border-color:var(--divider)}
.btn-line:disabled{color:var(--text-2);cursor:default}
.btn-line:active:not(:disabled),.btn-fill:active:not(:disabled){transform:scale(.985)}
.actionbar{display:flex;gap:12px;padding:10px var(--pad) 14px;background:var(--bg);flex:none}

/* 首页 */
.title{font-family:var(--serif-cn);font-size:32px;line-height:1.25;color:var(--text-1);margin:0}
.subtitle{font-size:13px;color:var(--text-2);margin:6px 0 0}
.stats{display:flex;flex-direction:column;gap:14px}
.stats .hd{font-size:16px;font-weight:500}
.statline{display:flex}
.stat{flex:1;text-align:center;display:flex;flex-direction:column;gap:4px}
.stat .n{font-family:var(--serif-en);font-size:22px;font-weight:600;color:var(--text-1)}
.stat .l{font-size:13px;color:var(--text-2)}
hr{border:0;border-top:1px solid var(--divider);margin:0}
.seg-ctl{display:flex;background:var(--bg);border-radius:8px;padding:2px;border:1px solid var(--divider)}
.seg-ctl button{flex:1;border:0;background:none;padding:7px 0;font-size:14px;font-family:inherit;
  color:var(--text-1);border-radius:6px;cursor:pointer}
.seg-ctl button.on{background:var(--surface);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.footnote{font-size:13px;line-height:1.6;color:var(--text-2)}

/* 默写 */
.recall-term{font-family:var(--serif-cn);font-size:32px;text-align:center;color:var(--text-1)}
.recall-sent{font-family:var(--serif-cn);font-size:28px;line-height:1.7;text-align:center;color:var(--text-1)}
.recall-sent.dim{font-size:26px;color:var(--text-2)}
textarea{
  width:100%;min-height:120px;max-height:200px;resize:vertical;padding:14px 16px;
  border-radius:var(--radius);border:1px solid var(--divider);background:var(--surface);
  color:var(--text-1);font:16px/1.5 inherit;outline:none;
}
textarea::placeholder{color:var(--text-2);opacity:.7}
.diff{font-family:var(--serif-en);font-size:17px;line-height:1.7;color:var(--text-1)}
.diff .miss{background:var(--hl);text-decoration:underline;text-underline-offset:3px}
.diff .extra{color:var(--error);text-decoration:line-through}
.badge-judge{font-size:13px;display:flex;align-items:center;gap:5px}
.badge-judge.ok{color:var(--accent)}
.badge-judge.no{color:var(--error)}

/* 错题本 */
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--divider);align-items:flex-start}
.mrow .body{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.mrow .cl{font-size:16px;color:var(--text-1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow .meta{font-size:13px;color:var(--text-2)}
.mrow .ops{display:flex;flex-direction:column;gap:6px;flex:none}
.mini{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--divider);
  background:var(--surface);color:var(--text-1);font-family:inherit;cursor:pointer}
.mini.del{color:var(--error)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 32px}
.empty .m1{font-size:16px;color:var(--text-1)}
.empty .m2{font-size:13px;color:var(--text-2)}
.illust{width:220px;height:180px;position:relative}
.illust .mtn{position:absolute;inset:auto 0 0 0;height:80px}
.illust .mtn i{position:absolute;bottom:0;left:0;right:0;height:100%;
  background:var(--text-2);opacity:.15;clip-path:polygon(0 100%,18% 35%,38% 75%,58% 20%,80% 65%,100% 40%,100% 100%)}
.illust .mtn i+i{background:var(--accent);opacity:.12;transform:translateY(12px)}
.illust .flame{position:absolute;left:50%;top:34px;transform:translateX(-50%);
  width:16px;height:22px;background:var(--accent);opacity:.6;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.illust .candle{position:absolute;left:50%;top:56px;transform:translateX(-50%);
  width:22px;height:46px;background:var(--text-2);opacity:.35;border-radius:11px}
.illust .scroll{position:absolute;left:50%;top:110px;transform:translateX(-50%);
  width:120px;height:60px;border-radius:6px;background:var(--accent);opacity:.35}

/* Tab 栏 */
.tabbar{
  display:flex;flex:none;border-top:1px solid var(--divider);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{flex:1;background:none;border:0;padding:8px 0 10px;font-size:11px;font-family:inherit;
  color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar button.on{color:var(--accent)}
/* 用线性 SVG 而不是 emoji：emoji 会被系统渲染成彩色贴图，
   和这套墨色/纸色的视觉不在一个调上，且不同手机长得不一样 */
.tabbar .ic{width:22px;height:22px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 全屏覆盖（做题流程） */
.cover{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;
  animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(6%);opacity:.7}to{transform:none;opacity:1}}

/* Toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:color-mix(in srgb,var(--text-2) 90%,transparent);color:var(--bg);
  font-size:13px;padding:8px 16px;border-radius:999px;z-index:20;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* 菜单弹层 */
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;
  align-items:flex-end;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 0 20px}
.sheet h4{margin:10px 20px 6px;font-size:13px;font-weight:400;color:var(--text-2)}
.sheet button{width:100%;background:none;border:0;padding:14px 20px;font-size:16px;
  font-family:inherit;color:var(--text-1);text-align:left;cursor:pointer}
.sheet button:active{background:var(--bg)}
.sheet .danger{color:var(--error)}
.sheet .cancel{text-align:center;color:var(--text-2);border-top:1px solid var(--divider);margin-top:6px}
</style>
</head>
<body>
<div id="phone"><div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>

<script src="data.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   古文英译刷词 · 网页体验版
   ──────────────────────────────────────────────────────────────────
   目的：iOS 版只能在 macOS 模拟器或 iPhone 上跑，Windows 上用浏览器体验
   同一套题库、同一套流程。逻辑尽量逐行对应 Swift 实现：
     TermLocator / DiffBuilder / Scheduler / QuizView / AnswerView
     / RecallView / MistakeBookView / HomeView
   差异只在渲染层（DOM 代替 SwiftUI），交互与数据口径保持一致。
   ══════════════════════════════════════════════════════════════════ */

/* 兜底：data.js 没跟着加载时（例如只把 index.html 单独打开、或预览面板
   不提供同目录静态文件），给一句人话提示，而不是留一片白屏。 */
if (!window.GUWEN) {
  document.getElementById("app").innerHTML = `
    <div style="padding:48px 28px;font-size:15px;line-height:1.8;color:#3E2C1E">
      <p style="font-size:17px;margin:0 0 12px">题库文件 data.js 没有加载到</p>
      <p style="margin:0 0 12px">本页需要和 <code>data.js</code> 放在同一个文件夹里一起打开。</p>
      <p style="margin:0;color:#7A6552">
        正确做法：直接双击 <code>web-demo/index.html</code>，用 Chrome 或 Edge 打开。<br>
        不要单独把 index.html 拖到别的地方，也不要只复制这一个文件。
      </p>
    </div>`;
  throw new Error("data.js 未加载：请直接双击 web-demo/index.html");
}

const DATA = window.GUWEN;
const CARDS = DATA.cards;
const BY_ID = new Map(CARDS.map(c => [c.id, c]));

/* ── 工具 ─────────────────────────────────────────────────────── */

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

const $ = sel => document.querySelector(sel);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 卡片统一访问器：词卡/句卡字段不同，这里抹平 */
const isWord = c => c.t === "w";
const answerOf = c => isWord(c) ? (c.te || "") : (c.fe || "");   // recallAnswer
const workName = c => {                                          // 篇名（去括号）
  const s = c.sw || "";
  const i = s.indexOf("（");
  return i >= 0 ? s.slice(0, i) : s;
};

/* ── TermLocator：term 在原文中的全部出现范围（含去标点退化） ── */

const PUNCT = new Set("、，。；：！？「」（）『』,. ;:!?()".split(""));

function termRanges(text, term) {
  if (!term) return [];
  const hits = [];
  let from = 0;
  while (true) {
    const i = text.indexOf(term, from);
    if (i < 0) break;
    hits.push([i, i + term.length]);
    from = i + term.length;
  }
  if (hits.length) return hits;

  // 退化：剔除标点后再找，映射回原串
  const kept = [];
  for (let i = 0; i < text.length; i++) if (!PUNCT.has(text[i])) kept.push(i);
  const stripped = kept.map(i => text[i]).join("");
  const strippedTerm = [...term].filter(ch => !PUNCT.has(ch)).join("");
  if (!strippedTerm) return [];
  const j = stripped.indexOf(strippedTerm);
  if (j < 0) return [];
  return [[kept[j], kept[j + strippedTerm.length - 1] + 1]];
}

/** 把原文中所有 term 出现处包成下划线 span（html 已转义） */
function markTerm(text, term) {
  const ranges = termRanges(text, term);
  if (!ranges.length) return esc(text);
  let out = "", last = 0;
  for (const [s, e] of ranges) {
    out += esc(text.slice(last, s)) + '<span class="term-u">' + esc(text.slice(s, e)) + "</span>";
    last = e;
  }
  return out + esc(text.slice(last));
}

/** ui_spec §3.5 规则 4：片段只高亮首个匹配 */
function highlightFirst(full, frag) {
  if (!frag) return esc(full);
  const i = full.indexOf(frag);
  if (i < 0) return esc(full);
  return esc(full.slice(0, i)) + '<span class="hl">' + esc(full.slice(i, i + frag.length)) + "</span>"
       + esc(full.slice(i + frag.length));
}

/** ui_spec §3.2：>400 字符的译文按 .!? 切句（U6） */
function splitLongEnglish(full) {
  if ([...full].length <= 400) return [full];
  const parts = [];
  let cur = "";
  for (const ch of full) {
    cur += ch;
    if (".!?".includes(ch)) { parts.push(cur.trim()); cur = ""; }
  }
  if (cur.trim()) parts.push(cur.trim());
  return parts.filter(Boolean);
}

/* ── DiffBuilder：word-level LCS（ui_spec §4.5） ─────────────── */

function diff(answer, input) {
  const aw = answer.split(" ").filter(Boolean);
  const iw = input.split(" ").filter(Boolean);
  const norm = w => w.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, "");
  const n = aw.length, m = iw.length;
  const lcs = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      lcs[i][j] = norm(aw[i]) === norm(iw[j])
        ? lcs[i + 1][j + 1] + 1
        : Math.max(lcs[i + 1][j], lcs[i][j + 1]);

  const A = [], I = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (norm(aw[i]) === norm(iw[j])) { A.push({ w: aw[i], k: "m" }); I.push({ w: iw[j], k: "m" }); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) { A.push({ w: aw[i], k: "miss" }); i++; }
    else { I.push({ w: iw[j], k: "extra" }); j++; }
  }
  while (i < n) A.push({ w: aw[i++], k: "miss" });
  while (j < m) I.push({ w: iw[j++], k: "extra" });
  return { answerTokens: A, inputTokens: I };
}

function renderTokens(tokens) {
  return tokens.map(t => {
    const w = esc(t.w);
    if (t.k === "miss") return '<span class="miss">' + w + "</span> ";
    if (t.k === "extra") return '<span class="extra">' + w + "</span> ";
    return w + " ";
  }).join("");
}

/* ── 进度状态与持久化 ─────────────────────────────────────────── */

const STORE_KEY = "guwen.web.v" + DATA.v;
const BLANK = () => ({ status: "new", cc: 0, att: 0, ok: 0, seen: null });

let S = loadState();

function loadState() {
  const base = { prog: {}, mistakes: [], ratio: 0.6, theme: "auto" };
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return base;
    const o = JSON.parse(raw);
    return Object.assign(base, o);
  } catch { return base; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
}
const stateOf = id => S.prog[id] || (S.prog[id] = BLANK());

/** learning 卡是否到期（引擎 §2.4，阶梯 [10min,1d,3d]） */
function isDue(st, now) {
  if (st.status !== "learning" || !st.seen) return false;
  const gap = st.cc === 0 ? 10 * 60e3 : st.cc === 1 ? 86400e3 : 3 * 86400e3;
  return now >= st.seen + gap;
}
const errorRate = st => st.att > 0 ? (st.att - st.ok) / st.att : 0;

function recordAnswer(card, isCorrect, countsTowardStatus) {
  const st = stateOf(card.id);
  st.att++;
  if (isCorrect) st.ok++;
  if (countsTowardStatus) {
    st.status = "learning";
    st.cc = isCorrect ? st.cc + 1 : 0;
    st.seen = Date.now();
    if (st.cc >= 3) st.status = "mastered";
  }
  save();
}

function statusCounts() {
  const c = { new: 0, learning: 0, mastered: 0 };
  for (const card of CARDS) c[stateOf(card.id).status]++;
  return c;
}
const totalAttempts = () => Object.values(S.prog).reduce((s, x) => s + x.att, 0);

/* ── Scheduler：抽题（learning_engine.md §8） ─────────────────── */

function weighted(cards) {
  return cards.map(card => {
    const st = stateOf(card.id);
    const w = (st.att >= 3 && errorRate(st) > 0.5) ? 2 : 1;
    return [card, w];
  });
}

function sampleWeighted(items, n) {
  if (n <= 0) return [];
  const pool = items.slice();
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, p) => s + p[1], 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < pool.length; i++) { r -= pool[i][1]; if (r <= 0) { idx = i; break; } }
    out.push(pool.splice(idx, 1)[0][0]);
  }
  return out;
}

function pickRound(wordRatio) {
  const now = Date.now();
  const nWord = Math.round(20 * wordRatio);
  const nSent = 20 - nWord;

  const pool = (type, pred) => CARDS.filter(c => c.t === type && pred(stateOf(c.id)));

  const newWord = pool("w", s => s.status === "new");
  const newSent = pool("s", s => s.status === "new");
  const dueWord = pool("w", s => isDue(s, now));
  const dueSent = pool("s", s => isDue(s, now));

  // 前 5 题：new 打头（3 词 + 2 句）
  let round = [];
  round = round.concat(sampleWeighted(weighted(newWord), Math.min(3, nWord)));
  round = round.concat(sampleWeighted(weighted(newSent), Math.min(2, nSent)));

  const cnt = (arr, t) => arr.filter(c => c.t === t).length;
  const tailWord = Math.max(0, nWord - cnt(round, "w"));
  const tailSent = Math.max(0, nSent - cnt(round, "s"));

  let tail = [];
  tail = tail.concat(sampleWeighted(weighted(dueWord), tailWord));
  tail = tail.concat(sampleWeighted(weighted(dueSent), tailSent));

  const used = new Set(round.concat(tail).map(c => c.id));
  const coldStart = dueWord.length === 0 && dueSent.length === 0;

  if (coldStart) {
    // 一张到期卡都没有（首轮必然如此）：按比例把 new 补满，否则凑不满 20 题
    const needW = Math.max(0, nWord - cnt(round, "w") - cnt(tail, "w"));
    const needS = Math.max(0, nSent - cnt(round, "s") - cnt(tail, "s"));
    for (const c of sampleWeighted(weighted(newWord.filter(x => !used.has(x.id))), needW)) { tail.push(c); used.add(c.id); }
    for (const c of sampleWeighted(weighted(newSent.filter(x => !used.has(x.id))), needS)) { tail.push(c); used.add(c.id); }
  } else {
    const shortage = tailWord + tailSent - tail.length;
    if (shortage > 0) {
      const newPool = shuffle(newWord.concat(newSent).filter(c => !used.has(c.id)));
      for (const c of newPool.slice(0, Math.min(3, shortage))) { tail.push(c); used.add(c.id); }
    }
  }

  // 仍不足 → mastered 按考频补位（不计状态流转）
  const fillIDs = new Set();
  const stillShort = tailWord + tailSent - tail.length;
  if (stillShort > 0) {
    const excluded = new Set(round.concat(tail).map(c => c.id));
    const mastered = CARDS
      .filter(c => stateOf(c.id).status === "mastered" && !excluded.has(c.id))
      .sort((a, b) => b.ef - a.ef)
      .slice(0, stillShort);
    for (const c of mastered) { tail.push(c); fillIDs.add(c.id); }
  }
  round = round.concat(tail);

  // 多字词保底：char_count ≥ 2 的词题 ≥ 3（R6）
  if (round.filter(c => isWord(c) && (c.cc || 0) >= 2).length < 3) {
    const excluded = new Set(round.map(c => c.id));
    const cand = CARDS.filter(c => isWord(c) && (c.cc || 0) >= 2 && !excluded.has(c.id));
    const due = cand.filter(c => isDue(stateOf(c.id), now)).sort((a, b) => b.ef - a.ef);
    const fresh = cand.filter(c => stateOf(c.id).status === "new").sort((a, b) => b.ef - a.ef);
    const mast = cand.filter(c => stateOf(c.id).status === "mastered").sort((a, b) => b.ef - a.ef);
    const queue = due.concat(fresh, mast);
    const singles = round.map((c, i) => [c, i])
      .filter(([c]) => isWord(c) && (c.cc || 0) === 1)
      .sort((a, b) => a[0].ef - b[0].ef);
    for (const [, idx] of singles) {
      if (!queue.length) break;
      round[idx] = queue.shift();
      if (round.filter(c => isWord(c) && (c.cc || 0) >= 2).length >= 3) break;
    }
  }

  // 轮内去重
  const seen = new Set();
  round = round.filter(c => { if (seen.has(c.id)) return false; seen.add(c.id); return true; });

  // 前 5 保持，其余打乱
  return { round: round.slice(0, 5).concat(shuffle(round.slice(5))), fillIDs };
}

/** 默写抽样：本轮答错优先，其余按考频降序补足 10 题（§4.1 P6=a） */
function pickRecallIDs(round, wrongIDs, count = 10) {
  const out = [];
  for (const c of round) if (wrongIDs.has(c.id) && out.length < count) out.push(c.id);
  if (out.length < count) {
    const rest = round.filter(c => !out.includes(c.id)).sort((a, b) => b.ef - a.ef);
    for (const c of rest) { if (out.length >= count) break; out.push(c.id); }
  }
  return out;
}

/* ── 判分（§4.4 P7=b：忽略大小写/首尾空格/开头冠词） ───────────── */

function judgeWordRecall(input, answer) {
  const norm = s => {
    let t = s.trim().toLowerCase();
    for (const a of ["the ", "a ", "an "]) if (t.startsWith(a)) { t = t.slice(a.length); break; }
    return t.trim();
  };
  return norm(input) === norm(answer);
}

/** 提示：正确答案前 2 个 ASCII 字母（§4.3） */
const hintPrefix = s => [...s].filter(ch => /[A-Za-z]/.test(ch)).slice(0, 2).join("");

let TAB = "home";          // home | mistakes
let SESSION = null;        // 进行中的轮次
let SCREEN = null;         // quiz | answer | recall | summary
let FILTER_WORK = null;    // 错题本筛选
let SHEET = null;          // 当前弹层

function newSession(mode, round, fillIDs) {
  return {
    mode, round, fillIDs,
    idx: 0, recallIdx: 0, recallIDs: [],
    wrong: new Set(), drafts: {}, recallCorrect: 0,
    selected: null, locked: false,
    shuffled: {},             // cardID → 已洗牌选项（答案页复现同一顺序）
    input: "", hintUsed: false, hintInserted: "", revealed: false, judged: null,
  };
}

const curCard = () => SESSION ? SESSION.round[SESSION.idx] : null;

/** 默写页当前卡：取自 recallIDs，而不是选择题的 currentIndex
 *  （iOS 版 RecallView 有独立的 currentCard，两者不能混用——
 *   混用会导致提示/判分落到选择题那张卡上） */
function recallCard() {
  if (!SESSION) return null;
  const id = SESSION.recallIDs[SESSION.recallIdx];
  const c = SESSION.round.find(x => x.id === id) || BY_ID.get(id) || null;
  return c || null;
}

function optionsFor(card) {
  if (SESSION.shuffled[card.id]) return SESSION.shuffled[card.id];
  const opts = shuffle([card.q.c, ...card.q.d.map(d => d[0])]);
  SESSION.shuffled[card.id] = opts;
  return opts;
}

const app = $("#app");

function render() {
  // 做题流程是全屏覆盖层，弹层（退出确认）要盖在它上面，所以两条分支都得拼 SHEET
  if (SESSION) {
    app.innerHTML = renderCover() + (SHEET ? renderSheet() : "");

  app.innerHTML = (TAB === "home" ? renderHome() : renderMistakes()) + renderTabbar()
                 + (SHEET ? renderSheet() : "");
}

    <p class="footnote" style="margin:0">

function stat(n, label) {
  return `<div class="stat"><div class="n">${n.toLocaleString("en-US")}</div><div class="l">${label}</div></div>`;
}

/* ── 错题本（MistakeBookView） ──────────────────────────────── */

function renderMistakes() {
  const all = S.mistakes;
  const list = FILTER_WORK ? all.filter(e => (BY_ID.get(e.id)?.sw || "").startsWith(FILTER_WORK)) : all;
  const works = [...new Set(all.map(e => workName(BY_ID.get(e.id) || {})))].filter(Boolean);

  if (!all.length) {
    return `
    <div class="navbar"><b>错题本</b><span>共 0 条</span></div>
    <div class="empty">
      <div class="illust">
        <div class="mtn"><i></i><i></i></div>
        <div class="flame"></div><div class="candle"></div>
        <div class="scroll"></div>
      </div>
      <div style="text-align:center">
        <div class="m1">还没有错题，继续做题吧</div>
        <div class="m2" style="margin-top:6px">答案页可随时把题目收进来</div>
      </div>
    </div>`;
  }

  return `
  <div class="navbar">
    <button class="nav-btn" data-act="filter">${esc(FILTER_WORK ? workNameOf(FILTER_WORK) : "全部")} ▾</button>
    <span>共 ${list.length} 条</span>
  </div>
  <div class="scroll page" style="padding-top:0">
    <div class="mlist">
      ${list.map(e => {
        const card = BY_ID.get(e.id);
        if (!card) return "";
        return `<div class="mrow">
          <span class="badge ${isWord(card) ? "w" : "s"}">${isWord(card) ? "文" : "句"}</span>
          <div class="body">
            <div class="cl">${esc(card.cl)}</div>
            <div class="meta">${esc(card.sw || "")}</div>
            <div class="meta">${relTime(e.at)}加入</div>
          </div>
          <div class="ops">
            <button class="mini" data-act="retrain" data-id="${card.id}">再练</button>
            <button class="mini del" data-act="undel" data-id="${card.id}">删除</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

const workNameOf = w => (w || "").indexOf("（") >= 0 ? w.slice(0, w.indexOf("（")) : (w || "");

function relTime(ts) {
  const d = Date.now() - ts;
  if (d < 60e3) return "刚刚";
  if (d < 3600e3) return Math.floor(d / 60e3) + " 分钟前";
  if (d < 86400e3) return Math.floor(d / 3600e3) + " 小时前";
  return Math.floor(d / 86400e3) + " 天前";
}

function renderCover() {
  if (SCREEN === "answer") return renderAnswer();
  if (SCREEN === "recall") return renderRecall();
  if (SCREEN === "summary") return renderSummary();
  return renderQuiz();
}

/* 页面一：选择题（QuizView §2） */
function renderQuiz() {
  const card = curCard();
  if (!card) {
    return `<div class="cover" style="align-items:center;justify-content:center;gap:16px">
      <p>本轮已结束</p><div style="width:200px"><button class="btn-fill" data-act="home">回首页</button></div>
    </div>`;
  }
  const ranges = isWord(card) ? termRanges(card.cl, card.tm) : [];
  const total = SESSION.round.length;
  const head = SESSION.mode === "retrain" ? "错题再练" : `第 ${SESSION.idx + 1}/${total} 题`;

  return `
  <div class="cover">
    <div class="navbar">
      <b>${head}</b>
      <button class="nav-btn" data-act="exit">退出</button>
    </div>
    ${SESSION.mode === "normal"
      ? `<div class="segbar">${Array.from({ length: total }, (_, i) =>
          `<i class="${i < SESSION.idx ? "on" : ""}"></i>`).join("")}</div>`
      : ""}
    <div class="scroll" style="padding:0 var(--pad)">
      <div class="stack" style="gap:24px;padding-top:8px">
        <div>
          ${isWord(card) && ranges.length ? '<div class="hint-line">选出划线词的释义</div>' : ""}
          <div class="stem">${isWord(card) ? markTerm(card.cl, card.tm) : esc(card.cl)}</div>
        </div>
        <div style="padding-bottom:24px">
          ${optionsFor(card).map((t, i) => {
            const sel = SESSION.selected === t;
            return `<button class="opt ${sel ? "sel" : ""}" data-act="pick" data-t="${esc(t)}" ${SESSION.locked ? "disabled" : ""}>
              <span class="t">${esc(t)}</span></button>`;
          }).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

/* 页面二：答案（AnswerView §3） */
function renderAnswer() {
  const card = curCard();
  if (!card) return "";
  const quiz = card.q;
  const selected = SESSION.selected;
  const opts = optionsFor(card);
  const ranges = isWord(card) ? termRanges(card.cl, card.tm) : [];
  const total = SESSION.round.length;
  const head = SESSION.mode === "retrain" ? "错题再练" : `第 ${SESSION.idx + 1}/${total} 题`;

  // 英译区
  let enHtml = "";
  if (isWord(card)) {
    enHtml = `<div class="en">${highlightFirst(card.fe || "", card.te || "")}</div>`;
  } else {
    const lines = splitLongEnglish(card.fe || "");
    enHtml = lines.length > 1
      ? `<div class="en-lines">${lines.map(l => `<p>${esc(l)}</p>`).join("")}</div>`
      : `<div class="en en-block">${esc(card.fe || "")}</div>`;
  }

  // 释义卡
  let infoHtml = "";
  if (isWord(card)) {
    const notFound = ranges.length === 0;
    infoHtml = `
      <div class="card">
        <div class="row"><span class="badge w">文</span>${esc(card.tm)}</div>
        ${notFound ? `<div class="kv"><div class="k" style="color:var(--error)">原句写作『${esc(card.tm)}』（含标点变化，未加下划线）</div></div>` : ""}
        ${card.m ? kv("本句义", card.m) : ""}
        ${card.os && card.os.length ? kv("其他义项", card.os.join("；")) : ""}
        ${card.em ? kv("常见错法", card.em) : ""}
      </div>`;
  } else {
    const d = quiz.d.find(x => x[0] === selected);
    infoHtml = `
      <div class="card">
        <div class="row"><span class="badge s">句</span>${esc(card.st || "")}
          <span style="font-size:13px;color:var(--text-2)">考频 ${card.ef || 0}</span></div>
        ${d && d[1] ? kv("干扰项解析", d[1]) : ""}
      </div>`;
  }

  const inBook = S.mistakes.some(e => e.id === card.id);

  return `
  <div class="cover">
    <div class="navbar"><b>${head}</b><span></span></div>
    <div class="scroll">
      <div class="stack" style="gap:16px;padding:0 var(--pad) 24px">
        <div class="stem left">${isWord(card) ? markTerm(card.cl, card.tm) : esc(card.cl)}</div>
        <div>${opts.map(t => {
          let cls = "dim", mk = "";
          if (t === quiz.c) { cls = "correct"; mk = '<span class="mk ok">✓</span>'; }
          else if (t === selected) { cls = "wrong"; mk = '<span class="mk no">✕</span>'; }
          return `<div class="opt ${cls}"><span class="t">${esc(t)}</span>${mk}</div>`;
        }).join("")}</div>
        ${enHtml}
        ${infoHtml}
        <div class="src">
          <div>${esc(card.sw || "")}</div>
          ${card.pv ? `<p data-act="ctx">前：${esc(card.pv)}</p>` : ""}
          ${card.nx ? `<p data-act="ctx">后：${esc(card.nx)}</p>` : ""}
        </div>
      </div>
    </div>
    <div class="actionbar">
      <button class="btn-line" data-act="addbook" ${inBook ? "disabled" : ""}>${inBook ? "已加入" : "加入错题本"}</button>
      <button class="btn-fill" data-act="next">${SESSION.mode === "retrain" ? "完成" : "下一题"}</button>
    </div>
  </div>`;
}

function kv(k, v) {
  return `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`;
}

        </div>
        <div class="badge-judge ${SESSION.judged ? "ok" : "no"}">
          <span>${SESSION.judged ? "✓" : "✕"}</span><span>${SESSION.judged ? "默写判对" : "默写判错"}</span>
        </div>`;
    } else {
      cmp = `
        <div class="stack" style="gap:8px">
          <div class="k" style="font-size:13px;color:var(--text-2)">你的默写</div>
          <div class="diff">${renderTokens(d.inputTokens)}</div>
        </div>
        <div class="stack" style="gap:8px">
          <div class="k" style="font-size:13px;color:var(--text-2)">正确答案</div>
          <div class="diff">${renderTokens(d.answerTokens)}</div>
        </div>
        ${SESSION.judged === null ? `
          <div style="display:flex;gap:12px">
            <button class="btn-line" data-act="self" data-ok="1">判对</button>
            <button class="btn-line" data-act="self" data-ok="0">判错</button>
          </div>` : `<div class="badge-judge ${SESSION.judged ? "ok" : "no"}">
             <span>${SESSION.judged ? "✓" : "✕"}</span><span>${SESSION.judged ? "默写判对" : "默写判错"}</span></div>`}`;
    }
    const needJudge = !isWord(card) && SESSION.judged === null;
    bodyHtml = `
      ${cmp}
      <button class="btn-fill" data-act="recall-next" ${needJudge ? "disabled" : ""}
        style="width:100%;flex:none;margin-top:4px">
        ${SESSION.recallIdx + 1 < total ? "下一题" : "完成默写"}
      </button>`;
  }

  return `
  <div class="cover">
    <div class="navbar"><b>检查 ${SESSION.recallIdx + 1}/${total}</b>
      <button class="nav-btn" data-act="exit">退出</button></div>
    <div class="scroll">
      <div class="stack" style="gap:20px;padding:12px var(--pad) 24px">
        ${promptHtml}
        ${bodyHtml}
      </div>
    </div>
  </div>`;
}

/* 小结（RecallSummaryView） */
function renderSummary() {
  return `
  <div class="cover" style="align-items:center;justify-content:center;gap:28px;padding:0 var(--pad)">
    <div class="illust" style="height:120px">
      <div class="scroll" style="top:20px;height:78px"></div>
    </div>
    <div style="text-align:center">
      <div class="recall-sent" style="font-size:32px">本轮完成</div>
      <p style="font-size:16px;color:var(--text-2);margin:8px 0 0">
        默写 ${SESSION.recallIDs.length} 题已计入统计</p>
    </div>
    <button class="btn-fill" data-act="home" style="width:100%;max-width:300px">回首页</button>
  </div>`;
}

/* Tab 栏 */
function renderTabbar() {
  const book = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/>
      <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H19"/></svg>`;
  const stack = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="8" width="18" height="12" rx="2"/>
      <path d="M6 5h12M8.5 2.5h7"/></svg>`;
  return `<div class="tabbar">
    <button class="${TAB === "home" ? "on" : ""}" data-act="tab" data-v="home">
      ${book}<span>今日</span></button>
    <button class="${TAB === "mistakes" ? "on" : ""}" data-act="tab" data-v="mistakes">
      ${stack}<span>错题本</span></button>
  </div>`;
}

/* 弹层（首页 ⋯ 菜单 / 错题本筛选 / 退出确认） */
function renderSheet() {
  if (SHEET.type === "menu") {
    const t = S.theme;
    return `<div class="sheet-mask" data-act="closesheet"><div class="sheet" onclick="event.stopPropagation()">
      <h4>外观</h4>
      <button data-act="theme" data-v="auto">跟随系统 ${t === "auto" ? "✓" : ""}</button>
      <button data-act="theme" data-v="light">浅色 ${t === "light" ? "✓" : ""}</button>
      <button data-act="theme" data-v="dark">深色 ${t === "dark" ? "✓" : ""}</button>
      <h4>数据</h4>
      <button class="danger" data-act="clear">清除全部学习记录</button>
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  if (SHEET.type === "confirmClear") {
    return `<div class="sheet-mask"><div class="sheet">
      <h4>清除全部学习记录？</h4>
      <p style="margin:0 20px 10px;font-size:13px;color:var(--text-2)">
        所有卡片的状态将回到「新卡」，错题本同时清空，此操作不可恢复。</p>
      <button class="danger" data-act="doclear">清除</button>
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  if (SHEET.type === "confirmExit") {
    const w = SHEET.where === "recall";
    return `<div class="sheet-mask"><div class="sheet">
      <h4>退出${w ? "默写" : "本轮"}？</h4>
      <p style="margin:0 20px 10px;font-size:13px;color:var(--text-2)">
        ${w ? "已判分的默写题计数会保留，剩余默写题不再进行。"
            : "已作答题目的计数会保留，本轮剩余题目不再进行。"}</p>
      <button class="danger" data-act="doexit">退出</button>
      <button class="cancel" data-act="closesheet">继续${w ? "默写" : "做题"}</button>
    </div></div>`;
  }
  if (SHEET.type === "filter") {
    const works = [...new Set(S.mistakes.map(e => workNameOf(BY_ID.get(e.id)?.sw || "")))].filter(Boolean);
    return `<div class="sheet-mask" data-act="closesheet"><div class="sheet" onclick="event.stopPropagation()">
      <h4>按篇目筛选</h4>
      <button data-act="dofilter" data-v="">全部 ${FILTER_WORK ? "" : "✓"}</button>
      ${works.map(w => `<button data-act="dofilter" data-v="${esc(workKey(w))}">${esc(w)} ${FILTER_WORK && workKey(FILTER_WORK) === w ? "✓" : ""}</button>`).join("")}
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  return "";
}

const workKey = w => w;

/* ══════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════ */

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case "tab":
      TAB = el.dataset.v; FILTER_WORK = null; render(); break;

    case "sheet": SHEET = { type: "menu" }; render(); break;
    case "closesheet": SHEET = null; render(); break;

    case "theme":
      S.theme = el.dataset.v; save();
      applyTheme();
      SHEET = null; render(); break;

    case "clear": SHEET = { type: "confirmClear" }; render(); break;
    case "doclear":
      S = { prog: {}, mistakes: [], ratio: S.ratio, theme: S.theme };
      save(); SHEET = null; render(); break;

    case "ratio":
      S.ratio = parseFloat(el.dataset.v); save(); render(); break;

    case "start": {
      const { round, fillIDs } = pickRound(S.ratio);
      SESSION = newSession("normal", round, fillIDs);
      SCREEN = "quiz"; render(); break;
    }

    case "retrain": {
      const card = BY_ID.get(el.dataset.id);
      if (!card) return;
      SESSION = newSession("retrain", [card], new Set());
      SCREEN = "quiz"; render(); break;
    }

    case "pick": {
      if (SESSION.locked) return;              // U2：锁定后二次点击无效
      const card = curCard();
      SESSION.selected = el.dataset.t;
      SESSION.locked = true;
      render();                                 // 先显示选中态
      setTimeout(() => {                        // 0.4s 后进答案页（ui_spec §1.3）
        const isCorrect = SESSION.selected === card.q.c;
        recordAnswer(card, isCorrect, SESSION.mode === "normal" && !SESSION.fillIDs.has(card.id));
        if (!isCorrect) SESSION.wrong.add(card.id);
        SESSION.locked = false;
        SCREEN = "answer";
        render();
      }, 400);
      break;
    }

    case "next": {
      if (SESSION.mode === "retrain") { SESSION = null; SCREEN = null; render(); return; }
      if (SESSION.idx + 1 < SESSION.round.length) {
        SESSION.idx++;
        SESSION.selected = null;
        SESSION.locked = false;
        SCREEN = "quiz";
      } else {
        SESSION.recallIDs = pickRecallIDs(SESSION.round, SESSION.wrong);
        SESSION.recallIdx = 0;
        resetRecall();
        SCREEN = "recall";
      }
      render(); break;
    }

    case "addbook": {
      const card = curCard();
      if (!S.mistakes.some(e => e.id === card.id)) {
        S.mistakes.unshift({ id: card.id, at: Date.now() });
        save();
      }
      toast("已加入错题本");
      render(); break;
    }

    case "hint": {
      const card = recallCard();
      if (!card) return;
      const h = hintPrefix(answerOf(card));
      SESSION.input += h;
      SESSION.hintInserted = h;
      SESSION.hintUsed = true;
      render(); break;
    }

    case "reveal": {
      const card = recallCard();
      if (!card) return;
      SESSION.drafts[card.id] = SESSION.input;
      if (isWord(card)) {
        const ok = judgeWordRecall(SESSION.input, answerOf(card));
        // P9=b：用过提示判对 → 只计 attempts，不计 correct
        recordAnswer(card, ok && !SESSION.hintUsed, false);
        SESSION.judged = ok;
      }
      SESSION.revealed = true;
      render(); break;
    }

    case "self": {
      const card = recallCard();
      if (!card || SESSION.judged !== null) return;
      const ok = el.dataset.ok === "1";
      recordAnswer(card, ok, false);
      SESSION.judged = ok;
      if (ok) SESSION.recallCorrect++;
      render(); break;
    }

    case "recall-next": {
      const total = SESSION.recallIDs.length;
      if (SESSION.recallIdx + 1 < total) {
        SESSION.recallIdx++;
        resetRecall();
        render();
      } else {
        SCREEN = "summary"; render();
      }
      break;
    }

    case "exit": SHEET = { type: "confirmExit", where: SCREEN === "recall" ? "recall" : "quiz" }; render(); break;
    case "doexit": SESSION = null; SCREEN = null; SHEET = null; render(); break;

    case "ctx": el.classList.toggle("open"); break;

    case "filter": SHEET = { type: "filter" }; render(); break;
    case "dofilter": FILTER_WORK = el.dataset.v || null; SHEET = null; render(); break;

    case "undel": {
      S.mistakes = S.mistakes.filter(e => e.id !== el.dataset.id);
      save(); render(); break;
    }
  }
});

/* 输入框（不重渲染，避免光标丢失） */
document.addEventListener("input", ev => {
  if (ev.target.id === "recall-input") SESSION.input = ev.target.value;
});

function resetRecall() {
  const card = recallCard();
  SESSION.input = (card && SESSION.drafts[card.id]) || "";
  SESSION.hintUsed = false;
  SESSION.hintInserted = "";
  SESSION.revealed = false;
  SESSION.judged = null;
}

let toastTimer = null;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; $("#phone").appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

/* 主题：auto 跟随系统，light/dark 强制 */
function applyTheme() {
  document.documentElement.dataset.theme = S.theme === "auto" ? "" : S.theme;
  if (S.theme === "auto") delete document.documentElement.dataset.theme;
}

/* 启动 */
applyTheme();
render();
console.log("[古文体验版] 卡片", CARDS.length, "数据版本 v" + DATA.v);

/* 离线缓存：仅 https 下注册（file:// 打开时浏览器不允许 SW，也没必要） */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      /* 注册失败不影响在线使用，只是没网时会白屏 */
    });
  });
}
</script>
