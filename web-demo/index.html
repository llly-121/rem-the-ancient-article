<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5E6D3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A211A">
<title>古文英译刷词</title>

<!-- 装到手机主屏：iOS 只认 apple-* 这几条，W3C 的 manifest 它只读一部分。
     缺 apple-mobile-web-app-capable 的话，加进去的只是网址书签，
     点开还会带上 Safari 的地址栏和工具栏，不像个 App。 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="古文刷词">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
/* ─────────────────────────────────────────────────────────────
   设计令牌：与 ios/GuwenApp/Theme.swift 一一对应
   浅色 #F5E6D3 …  深色 #2A211A …
   ───────────────────────────────────────────────────────────── */
:root{
  color-scheme: light dark;
  --bg:#F5E6D3; --surface:#FFFBF4; --accent:#C97B4A;
  --text-1:#3E2C1E; --text-2:#7A6552; --error:#8B7A8B; --divider:#E3D3BF;
  --hl:rgba(201,123,74,.25);
  /* 对错语义色。--accent 是按钮/进度条/徽标的主色，不能拿它兼任「正确」，
     否则整套视觉会跟着变调，所以单独开两个令牌 */
  --ok:#2E7D4F; --bad:#B23A34;
  --radius:16px; --radius-sm:10px; --radius-md:12px; --pad:20px;
  /* 卡片细边与两级阴影。原来全站只有 1 处卡片级阴影，三块首页模块靠同底色
     堆在一起，看起来就是三张平贴的纸；这一圈 1px 的暖灰边 + 极淡弥散阴影
     让它们浮起来，但不改色系 */
  --hairline:rgba(139,115,85,.14);
  --shadow-1:0 1px 2px rgba(62,44,30,.05),0 3px 10px rgba(62,44,30,.045);
  --shadow-2:0 8px 24px rgba(100,80,60,.10);
  --serif-cn:"Songti SC","STSong","SimSun","Noto Serif CJK SC",serif;
  --serif-en:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#2A211A; --surface:#3A2E24; --accent:#D99462;
    --text-1:#F0E4D4; --text-2:#B5A08C; --error:#A892A8; --divider:#4A3B2E;
    --hl:rgba(217,148,98,.25);
    --ok:#7CC08F; --bad:#E58C7E;
    --hairline:rgba(240,228,212,.10);
    --shadow-1:0 1px 2px rgba(0,0,0,.22),0 3px 10px rgba(0,0,0,.16);
    --shadow-2:0 8px 24px rgba(0,0,0,.42);
  }
}
/* 手动强制外观（首页 ⋯ 菜单可切），特异性高于上面的媒体查询 */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F5E6D3; --surface:#FFFBF4; --accent:#C97B4A;
  --text-1:#3E2C1E; --text-2:#7A6552; --error:#8B7A8B; --divider:#E3D3BF;
  --hl:rgba(201,123,74,.25);
  --ok:#2E7D4F; --bad:#B23A34;
  --hairline:rgba(139,115,85,.14);
  --shadow-1:0 1px 2px rgba(62,44,30,.05),0 3px 10px rgba(62,44,30,.045);
  --shadow-2:0 8px 24px rgba(100,80,60,.10);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#2A211A; --surface:#3A2E24; --accent:#D99462;
  --text-1:#F0E4D4; --text-2:#B5A08C; --error:#A892A8; --divider:#4A3B2E;
  --hl:rgba(217,148,98,.25);
  --ok:#7CC08F; --bad:#E58C7E;
  --hairline:rgba(240,228,212,.10);
  --shadow-1:0 1px 2px rgba(0,0,0,.22),0 3px 10px rgba(0,0,0,.16);
  --shadow-2:0 8px 24px rgba(0,0,0,.42);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{
  /* 手机上连点答案时不要触发「双击放大」，否则页面会被顶花 */
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
body{
  background:#1a1512;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-1);
  overflow:hidden;
  overscroll-behavior:none;
}
@media (prefers-color-scheme: dark){ body{background:#0e0b09} }

/* 桌面：伪装成一台手机 */
#phone{
  position:relative;width:390px;height:844px;max-height:100vh;max-width:100%;
  background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
  transition:background .2s;
}
@media (min-width:560px) and (min-height:900px){
  #phone{border-radius:44px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 10px #2b2320,0 0 0 11px #4a3f38}
}

/* 手机浏览器 & 主屏 App：一律铺满，不要「手机里再套个手机」的黑边。
   判断依据用屏宽而不是 display-mode —— 第一遍几乎都是在 Safari 里点开的，
   那时 display-mode 还是 browser，若只认 standalone，iPhone Max 机型上
   会露出四周一圈黑框（390 的机身塞进 430 的屏）。
   同时按刘海/底部横条留安全区，否则「错题本」那一栏会被 Home Indicator 压住。 */
@media (max-width:559px), (display-mode: standalone){
  body{background:var(--bg)}
  #phone{
    width:100%;height:100vh;height:100dvh;max-height:none;
    border-radius:0;box-shadow:none;
  }
  .navbar{padding-top:calc(14px + env(safe-area-inset-top))}
  .actionbar{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .tabbar{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
}

/* 长按不要弹「拷贝/查词」气泡，交互控件上文字也不需要被选中 */
button,.opt,.tabbar,.navbar,.segbar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* 首屏加载层。
   data.js 有 1.2 MB，4G 弱网下要几秒；这段时间 #app 是空的，
   如果是纯白（纯米色）一片，头一次用的人会以为链接坏了、反复刷新。
   它盖在 #app 上，等页面第一次渲染出内容（#app 非空）自动消失，
   不需要 JS 参与，所以 data.js 加载失败走兜底提示时也能正确隐藏。 */
#boot{position:absolute;inset:0;z-index:30;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .2s}
#boot .boot-t{font-family:var(--serif-cn);font-size:26px;letter-spacing:2px;color:var(--text-1)}
#boot .boot-s{font-size:13px;color:var(--text-2)}
#boot .boot-bar{width:120px;height:3px;border-radius:2px;background:var(--divider);overflow:hidden}
#boot .boot-bar i{display:block;width:40%;height:100%;border-radius:2px;background:var(--accent);
  animation:bootslide 1.1s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#app:not(:empty) + #boot{display:none}

/* ── 通用 ── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:24px var(--pad) 32px}
.stack{display:flex;flex-direction:column}

/* 导航条 */
.navbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px var(--pad) 8px;font-size:13px;color:var(--text-2);flex:none;
}
/* 标题占满剩余宽度并允许省略：篇内刷题时标题是「岳阳楼记 · 12/20」，
   长篇名会把右边的退出按钮挤出去 */
.navbar b{font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{background:none;border:0;color:var(--text-2);font-size:13px;padding:4px;cursor:pointer;font-family:inherit;
  /* 手指按得中：热区至少 44×44 */
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.nav-btn:active{opacity:.5}
/* 「退出」必须看得出是按钮。原先它和左边「第 3/20 题」同字号、同颜色、无边框，
   扫一眼就是标题的后半句 —— 这是用户「退不出去」的真正原因。 */
.nav-btn.solid{
  padding:0 14px;border:1px solid var(--divider);background:var(--surface);
  color:var(--text-1);border-radius:10px;font-size:14px;
}

/* 进度条 20 段 */
.segbar{display:flex;gap:4px;padding:6px var(--pad) 8px;flex:none}
.segbar i{width:12px;height:6px;border-radius:2px;background:var(--divider);flex:none}
.segbar i.on{background:var(--accent)}

/* 题面 */
.stem{
  font-family:var(--serif-cn);font-size:28px;line-height:1.75;
  color:var(--text-1);text-align:center;padding:12px 0;
}
.stem.left{text-align:left;font-size:26px;line-height:1.7}
.term-u{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px}
.hint-line{font-size:13px;color:var(--text-2);text-align:center;margin-bottom:2px}

/* 选项 */
.opt{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:14px 16px;border-radius:var(--radius);background:var(--surface);
  border:1px solid var(--divider);color:var(--text-1);font-size:16px;
  font-family:inherit;line-height:1.45;cursor:pointer;transition:border-color .15s,opacity .15s;
  margin-bottom:12px;
}
.opt span.t{flex:1}
/* 注意：.sel（还没揭晓的选中）与 .correct（揭晓后的正确项）必须分开上色。
   这两条规则原先文本完全一样，一起改成绿色的话，手指点一下选项就提前变绿，
   用户根本看不出「还没公布答案」。 */
.opt.sel{border-color:var(--accent);border-width:1.5px}
.opt.correct{border-color:var(--ok);border-width:2px}
.opt.correct .t{color:var(--ok);font-weight:500}
.opt.wrong{border-color:var(--bad);border-width:2px}
.opt.wrong .t{color:var(--bad)}
.opt.dim{opacity:.6}
/* 手指按下去的那一瞬间就要有反馈。答案页现在是点完即到，中间没有「选中态」
   那一帧了，若不加这条，选项在低端机上看起来就像没反应。 */
.opt:active{border-color:var(--accent);border-width:1.5px;background:var(--hl)}
.opt .mk{font-size:17px;flex:none;line-height:1;font-weight:600}
.opt .mk.ok{color:var(--ok)}
.opt .mk.no{color:var(--bad)}

/* 英译区 */
.en{font-family:var(--serif-en);font-size:17px;line-height:1.55;color:var(--text-1)}
.en .hl{background:var(--hl);border-radius:2px}
.en-block{padding:8px 10px;background:var(--hl);border-radius:8px}
.en-lines{max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.en-lines p{margin:0;padding:6px;background:var(--hl);border-radius:6px;font-family:var(--serif-en);font-size:17px;line-height:1.55}

/* 可点的英文单词。用 <span> 而不是 <button>：词高只有 26px，
   check_mobile.py 会扫所有 button 并要求热区 ≥44pt，一加就报「手指按不中」 */
.en .w,.sd-en .w{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone}
.en .w:active,.sd-en .w:active{background:var(--hl)}

/* 点词浮卡。
   视觉按「浅色宣纸 / 半透明暖色玻璃」：底色带一点透明的米白 + 8px 模糊，
   让底下的纸色微微透上来；边框极细的暖褐，阴影大范围低透明度，像纸片浮在书页上。
   关键约束：这张卡必须挂在 #phone 上，不能挂进 .cover ——
   .cover 有 transform（slide 进场动画），Safari 里 transform 祖先会让
   backdrop-filter 失效，玻璃质感直接变成一块实心色。 */
.gw-tip{
  position:absolute;z-index:40;width:260px;padding:12px 14px;border-radius:12px;
  background:rgba(255,252,245,.86);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:1px solid rgba(139,115,85,.2);
  box-shadow:0 8px 24px rgba(100,80,60,.12);
  opacity:0;transform:translateY(4px);
  transition:opacity .16s ease,transform .16s ease;
}
.gw-tip.in{opacity:1;transform:none}
/* 暖纸白压在深色底上会发灰、糊成一团，深色必须另给一套 */
@media (prefers-color-scheme:dark){
  .gw-tip{background:rgba(58,46,36,.84);border-color:rgba(240,228,212,.16);
    box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .gw-pos{color:#D89A76}
}
html[data-theme="light"] .gw-tip{background:rgba(255,252,245,.86);
  border-color:rgba(139,115,85,.2);box-shadow:0 8px 24px rgba(100,80,60,.12)}
html[data-theme="dark"] .gw-tip{background:rgba(58,46,36,.84);
  border-color:rgba(240,228,212,.16);box-shadow:0 8px 24px rgba(0,0,0,.45)}
html[data-theme="dark"] .gw-pos{color:#D89A76}

.gw-hd{display:flex;align-items:center;gap:4px}
.gw-w{flex:1;min-width:0;font-family:var(--serif-en);font-size:21px;font-weight:600;
  color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 44×44 是手指按得中的底线；负 margin 把视觉高度收回去，卡片不会因此变胖 */
.gw-ic{width:44px;height:44px;margin:-9px 0;flex:none;border:0;background:none;
  color:var(--text-2);display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:10px;font-family:inherit}
.gw-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.gw-ic:active{background:var(--hl)}
.gw-ic.on{color:var(--accent)}
.gw-tag{flex:none;font-size:11px;padding:3px 8px;border-radius:6px;
  background:#E8F0EA;color:#3F6B57;letter-spacing:.02em}
.gw-ipa{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:13px;
  color:var(--text-2);font-family:var(--serif-en)}
.gw-body{margin-top:8px;display:flex;gap:6px;font-size:14px;line-height:1.55;color:var(--text-1)}
.gw-pos{flex:none;font-size:12px;color:#9A5B3B;padding-top:2px}
.gw-cur{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(139,115,85,.28);
  font-size:12px;line-height:1.6;color:var(--text-2)}
.gw-none{margin-top:6px;font-size:13px;color:var(--text-2)}

/* 信息卡。细边 + 极淡弥散阴影是这一版「质感」的主要来源：
   不加边和影，同底色的三块内容会糊成一张大纸，看不出是三个独立模块 */
.card{background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-1);
  border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.badge{width:20px;height:20px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;border:1px solid var(--accent);background:rgba(201,123,74,.10);color:var(--text-1)}
.badge.w{border-radius:4px}
.badge.s{border-radius:50%}
.row{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--text-1)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv .k{font-size:13px;color:var(--text-2)}
.kv .v{font-size:16px;color:var(--text-1)}
.src{font-size:13px;color:var(--text-2);display:flex;flex-direction:column;gap:6px}
.src p{margin:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src p.open{white-space:normal}

/* 按钮 */
.btn-fill,.btn-line{
  flex:1;min-height:44px;border-radius:12px;font-size:16px;font-family:inherit;
  cursor:pointer;border:1px solid transparent;padding:0 12px;
  transition:transform .1s ease,background .18s ease,color .18s ease;
}
.btn-fill{background:var(--accent);color:var(--bg);font-weight:500}
.btn-fill:disabled{background:var(--divider);color:var(--text-2);cursor:default}
.btn-line{background:var(--surface);color:var(--text-1);border-color:var(--divider)}
.btn-line:disabled{color:var(--text-2);cursor:default}
.btn-line:active:not(:disabled),.btn-fill:active:not(:disabled){transform:scale(.985)}
.actionbar{display:flex;gap:12px;padding:10px var(--pad) 14px;background:var(--bg);flex:none}

/* 首页 */
.title{font-family:var(--serif-cn);font-size:32px;line-height:1.25;font-weight:600;
  letter-spacing:.03em;color:var(--text-1);margin:0}
.subtitle{font-size:13px;color:var(--text-2);margin:6px 0 0}
.stats{display:flex;flex-direction:column;gap:14px}
.stats .hd{font-size:16px;font-weight:500}
.statline{display:flex}
.stat{flex:1;text-align:center;display:flex;flex-direction:column;gap:4px}
.stat .n{font-family:var(--serif-en);font-size:22px;font-weight:600;color:var(--text-1);
  font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--text-2)}
hr{border:0;border-top:1px solid var(--divider);margin:0}
.seg-ctl{display:flex;background:var(--bg);border-radius:8px;padding:2px;border:1px solid var(--divider)}
.seg-ctl button{flex:1;border:0;background:none;padding:0;min-height:44px;font-size:14px;font-family:inherit;
  color:var(--text-1);border-radius:6px;cursor:pointer}
.seg-ctl button.on{background:var(--surface);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.footnote{font-size:13px;line-height:1.6;color:var(--text-2)}

/* 小结页标题。原先借用 .recall-sent 撑 32px，默写删掉后必须自己有一条，
   否则「本轮完成」会掉回正文的 16px。 */
.summary-title{font-family:var(--serif-cn);font-size:32px;line-height:1.3;font-weight:600;
  letter-spacing:.03em;color:var(--text-1)}

/* 答案页的白话块：英文看不明白就往下一格看中文 */
.zh{padding:10px 12px;background:var(--surface);border-radius:10px;border:1px solid var(--divider)}
.zh .zh-k{font-size:12px;color:var(--text-2);margin-bottom:4px}
.zh .zh-v{font-size:15px;line-height:1.7;color:var(--text-1)}

/* 首页「按篇刷题」入口。
   原来是 <div>，且背景/圆角/内边距与 .card 三项完全相同 —— 读起来就是第三张
   白卡片，没有任何「这里可以点」的信号，这是「单调」的准确来源。
   现在：改成真按钮（可聚焦、按得中、进热区检查范围），左侧书卷图标，
   右侧圆形箭头，按下时轻微回缩。 */
.entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-1);
  border-radius:var(--radius);padding:16px;cursor:pointer;min-height:44px;
  font-family:inherit;color:inherit;
  transition:transform .12s ease,box-shadow .18s ease}
.entry:active{transform:scale(.995);box-shadow:none}
.entry .e-ic{width:36px;height:36px;flex:none;border-radius:11px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;color:var(--accent)}
.entry .e-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.entry .e-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.entry .e-t{font-family:var(--serif-cn);font-size:18px;font-weight:500;letter-spacing:.02em;color:var(--text-1)}
.entry .e-s{font-size:12px;color:var(--text-2)}
.entry .e-a{width:28px;height:28px;flex:none;border-radius:50%;background:var(--bg);
  color:var(--text-2);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.entry:active .e-a{color:var(--accent)}

/* 篇章目录 */
.grp{font-size:13px;color:var(--text-2);margin:16px 0 4px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--divider)}
.work-row{display:flex;align-items:center;gap:10px;padding:12px 0;min-height:56px;
  border-bottom:1px solid var(--divider);cursor:pointer}
.work-row .wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.work-row .wt{font-family:var(--serif-cn);font-size:17px;color:var(--text-1)}
.work-row .wt em{font-style:normal;font-size:12px;color:var(--text-2);margin-left:6px;font-family:inherit}
.work-row .wm{font-size:12px;color:var(--text-2)}
.pbar{height:4px;border-radius:2px;background:var(--divider);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .35s ease}
/* 档位按钮：手机上热区也要够 44，否则点不中。
   圆角用 10px 而不是 999px —— 宽高都卡在 44 时，999px 会把它画成一个圆球，
   在一列文字里特别抢眼，看着像头像。
   颜色刻意保持中性：分组标题已经写着「重点」，每行再标一次橙色只是噪音，
   这个按钮的作用是「改档」，不是「状态徽章」。 */
.lv-btn{font-size:12px;padding:0 14px;min-height:44px;min-width:64px;border-radius:10px;
  border:1px solid var(--divider);background:var(--surface);color:var(--text-2);
  font-family:inherit;flex:none;cursor:pointer}
.legend{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}

/* 「本机」徽章：自己加的篇目只在这台手机上，必须一眼能认出来，
   否则换台设备发现篇目没了会以为是数据丢了 */
.wtag{font-style:normal;font-size:10px;padding:2px 6px;border-radius:5px;margin-left:6px;
  background:var(--hl);color:var(--text-2);font-family:inherit;vertical-align:2px;letter-spacing:.02em}

/* 添加篇目：导航条上的「＋」。和「‹ 目录」同尺寸，保证 44 热区 */
.nav-add{font-size:20px;line-height:1;color:var(--text-1);border:1px solid var(--divider);
  background:var(--surface);border-radius:10px;min-width:44px;min-height:44px}

/* 添加篇目表单 */
.f-lb{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--text-2);margin:18px 0 6px}
.f-lb em{font-style:normal;font-size:12px;color:var(--text-2);opacity:.75;margin-left:auto}
.f-lb em.bad{color:var(--error);opacity:1}
.f-in,.f-tx{width:100%;box-sizing:border-box;border:1px solid var(--hairline);border-radius:10px;
  background:var(--surface);color:var(--text-1);font-family:inherit;
  /* 16px 以下 iOS 会在聚焦时自动放大页面，整页会跳一下 */
  font-size:16px;padding:11px 12px;outline:none}
.f-tx{font-family:var(--serif-cn);font-size:16px;line-height:1.9;min-height:112px;resize:vertical}
.f-in:focus,.f-tx:focus{border-color:var(--accent)}
.f-hint{font-size:12px;color:var(--text-2);line-height:1.7;margin:10px 0 0}
.f-err{font-size:13px;color:var(--error);line-height:1.6;margin:14px 0 0;min-height:1em}

/* 篇详情：整篇原文。未刷的用 --text-2 灰，刷过的用 --text-1 黑盖上去 */
.worktext{font-family:var(--serif-cn);font-size:19px;line-height:2.05;letter-spacing:.4px}
.worktext p{margin:0 0 14px}
.sl{color:var(--text-2);cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone}
.sl.done{color:var(--text-1)}
.sl:active{background:var(--hl)}

/* 句详情弹层 */
.sd-cl{font-family:var(--serif-cn);font-size:20px;line-height:1.8;color:var(--text-1);margin:0 0 12px}
.sd-en{font-family:var(--serif-en);font-size:15px;line-height:1.65;color:var(--text-1);margin:0 0 12px}
.sd-k{font-size:12px;color:var(--text-2);margin:0 0 4px}
.sheet-body{padding:0 20px 12px}
.sheet-body p{margin:0 0 10px;font-size:15px;line-height:1.7;color:var(--text-1)}

/* 错题本 */
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--divider);align-items:flex-start}
.mrow .body{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.mrow .cl{font-size:16px;color:var(--text-1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow .meta{font-size:13px;color:var(--text-2)}
.mrow .ops{display:flex;flex-direction:column;gap:6px;flex:none}
.mini{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--divider);
  background:var(--surface);color:var(--text-1);font-family:inherit;cursor:pointer}
.mini.del{color:var(--error)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 32px}
.empty .m1{font-size:16px;color:var(--text-1)}
.empty .m2{font-size:13px;color:var(--text-2)}
.illust{width:220px;height:180px;position:relative}
.illust .mtn{position:absolute;inset:auto 0 0 0;height:80px}
.illust .mtn i{position:absolute;bottom:0;left:0;right:0;height:100%;
  background:var(--text-2);opacity:.15;clip-path:polygon(0 100%,18% 35%,38% 75%,58% 20%,80% 65%,100% 40%,100% 100%)}
.illust .mtn i+i{background:var(--accent);opacity:.12;transform:translateY(12px)}
.illust .flame{position:absolute;left:50%;top:34px;transform:translateX(-50%);
  width:16px;height:22px;background:var(--accent);opacity:.6;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.illust .candle{position:absolute;left:50%;top:56px;transform:translateX(-50%);
  width:22px;height:46px;background:var(--text-2);opacity:.35;border-radius:11px}
.illust .scroll{position:absolute;left:50%;top:110px;transform:translateX(-50%);
  width:120px;height:60px;border-radius:6px;background:var(--accent);opacity:.35}

/* Tab 栏 */
.tabbar{
  display:flex;flex:none;border-top:1px solid var(--divider);background:var(--bg);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{flex:1;background:none;border:0;padding:8px 0 10px;font-size:12px;font-family:inherit;
  color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabbar button.on{color:var(--accent)}
/* 用线性 SVG 而不是 emoji：emoji 会被系统渲染成彩色贴图，
   和这套墨色/纸色的视觉不在一个调上，且不同手机长得不一样 */
.tabbar .ic{width:22px;height:22px;display:block;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* 全屏覆盖（做题流程） */
.cover{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;
  animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(6%);opacity:.7}to{transform:none;opacity:1}}

/* Toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);
  background:color-mix(in srgb,var(--text-2) 90%,transparent);color:var(--bg);
  font-size:13px;padding:8px 16px;border-radius:999px;z-index:20;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* 菜单弹层 */
.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;
  align-items:flex-end;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 0 20px;
  max-height:84vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h4{margin:10px 20px 6px;font-size:13px;font-weight:400;color:var(--text-2)}
.sheet button{width:100%;background:none;border:0;padding:14px 20px;font-size:16px;
  font-family:inherit;color:var(--text-1);text-align:left;cursor:pointer}
.sheet button:active{background:var(--bg)}
.sheet .danger{color:var(--error)}
.sheet .cancel{text-align:center;color:var(--text-2);border-top:1px solid var(--divider);margin-top:6px}

/* 切页时的一次性淡入。
   为什么不直接挂在 .card 上：render() 是整块 app.innerHTML 重绘，挂在类上的
   animation 每次重绘都会重播 —— 开一下「⋯」弹层、切一下主题，首页卡片就会
   重新淡入一次，很廉价。所以只给 #app 挂一个用完即摘的 class。
   只淡不改形：加 transform 会让 #phone 里的 absolute 子元素临时换定位基准。 */
#app.entering{animation:enterFade .22s ease-out}
@keyframes enterFade{from{opacity:0}to{opacity:1}}

/* 系统开了「减弱动态效果」就全关掉。注意不动 .cover 的 slide：
   那是既有观感，也没人反馈过晕，改了反而像回归。 */
@media (prefers-reduced-motion:reduce){
  .entry,.btn-fill,.btn-line,.pbar i{transition:none}
  #app.entering{animation:none}
  .entry:active{transform:none}
}
</style>
</head>
<body>
<div id="phone"><div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0"></div><div id="boot">
  <div class="boot-t">古文英译刷词</div>
  <div class="boot-bar"><i></i></div>
  <div class="boot-s">正在打开题库，第一次要等一下</div>
</div></div>

<script src="data.js"></script>
<script src="dict.js"></script>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   古文英译刷词 · 网页体验版
   ──────────────────────────────────────────────────────────────────
   目的：iOS 版只能在 macOS 模拟器或 iPhone 上跑，Windows 上用浏览器体验
   同一套题库、同一套流程。逻辑尽量逐行对应 Swift 实现：
     TermLocator / DiffBuilder / Scheduler / QuizView / AnswerView
     / MistakeBookView / HomeView
   差异只在渲染层（DOM 代替 SwiftUI），交互与数据口径保持一致。

   另有一块 iOS 版没有的东西：按篇刷题（目录 → 篇详情 → 通读 / 逐句刷）。
   数据来自 DATA.works，即 course_cards_v2.jsonl 全量 25 篇 654 句。
   ══════════════════════════════════════════════════════════════════ */

/* 兜底：data.js 没跟着加载时（例如只把 index.html 单独打开、或预览面板
   不提供同目录静态文件），给一句人话提示，而不是留一片白屏。 */
if (!window.GUWEN) {
  document.getElementById("app").innerHTML = `
    <div style="padding:48px 28px;font-size:15px;line-height:1.8;color:#3E2C1E">
      <p style="font-size:17px;margin:0 0 12px">题库文件 data.js 没有加载到</p>
      <p style="margin:0 0 12px">本页需要和 <code>data.js</code> 放在同一个文件夹里一起打开。</p>
      <p style="margin:0;color:#7A6552">
        正确做法：直接双击 <code>web-demo/index.html</code>，用 Chrome 或 Edge 打开。<br>
        不要单独把 index.html 拖到别的地方，也不要只复制这一个文件。
      </p>
    </div>`;
  throw new Error("data.js 未加载：请直接双击 web-demo/index.html");
}

const DATA = window.GUWEN;
const CARDS = DATA.cards;
const BY_ID = new Map(CARDS.map(c => [c.id, c]));

/* 篇章索引：内置 25 篇 / 654 句，外加用户自己在手机上加的「本机篇目」。
   万一有人拿旧 data.js 配新 index.html（或 CDN 缓存半新半旧），这里退化成空数组，
   篇章入口自己隐藏，不至于整页白屏。 */
const WORKS = (DATA.works || []).slice();
const CUSTOM_SPECS = loadCustomSpecs();
for (const spec of CUSTOM_SPECS) WORKS.push(specToWork(spec));
const WORK_BY_NAME = new Map(WORKS.map(w => [w.t, w]));
/** 卡片 id → [篇名, 句号]。答案页靠它找当前这句的白话，也靠它判「这句刷过没」 */
const CARD_SENT = new Map();
for (const w of WORKS) w.s.forEach((s, i) => {
  (s.w || []).forEach(id => CARD_SENT.set(id, [w.t, i]));
  if (s.q) CARD_SENT.set(s.q, [w.t, i]);
});
/** 本机篇目的句卡是运行时合成的，得手动塞进 BY_ID，否则 answer 页取不到 */
for (const w of WORKS) if (w.custom) w.s.forEach(s => { if (s.q) BY_ID.set(s.q, makeCustomCard(w, s)); });
let N_ALL_SENT = WORKS.reduce((n, w) => n + w.s.length, 0);

/* ══════════════════════════════════════════════════════════════
   本机篇目：用户自己在手机上加的篇目
   ══════════════════════════════════════════════════════════════

   为什么只能存 localStorage：这是个纯静态站，没有后端也没有数据库。
   手机上写进去的东西回不到 data.js，所以：

   · 只有这台设备看得到，换手机、清缓存就没了 → 目录里标「本机」
   · 没有人工校订的词卡（那 1,346 张是一句一句改出来的），所以只能出
     句级四选一，干扰项从题库里长度相近的英译里抽
   · 干扰项质量一定不如人工那批，answer 页如实写「干扰项来自题库里的其他篇目」

   要和那 25 篇同等对待，仍然得把内容交给维护者走 ingest_work.py 入库。 */
const CUSTOM_KEY = "guwen.web.custom.v1";

function loadCustomSpecs() {
  try {
    const a = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]");
    return Array.isArray(a) ? a.filter(x => x && x.t && Array.isArray(x.s) && x.s.length) : [];
  } catch { return []; }
}

function saveCustomSpecs(list) {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(list)); } catch {}
}

/** 给自造句挑 3 个干扰项：优先长度相近（0.6–1.8 倍）的，凑不满就用全库。
 *  必须去重、也必须排掉正确答案本身 —— 否则答案页会出现两个一模一样的选项。 */
function pickDistractors(en, k = 3) {
  const L = Math.max(12, en.length);
  const near = [], all = [];
  for (const c of CARDS) {
    const t = c.fe || "";
    if (!t || t === en) continue;
    all.push(t);
    if (t.length >= L * 0.6 && t.length <= L * 1.8) near.push(t);
  }
  const pool = near.length >= k ? near.slice() : all;
  for (let i = pool.length - 1; i > 0; i--) {          // 洗牌
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const out = [], seen = new Set([en]);
  for (const t of pool) {
    if (out.length >= k) break;
    if (seen.has(t)) continue;
    seen.add(t); out.push(t);
  }
  return out;
}

/** 本机篇目的一张句卡。字段要和 data.js 里的句卡同形，
 *  renderAnswer / 错题本 / 统计都直接按老字段读。 */
function makeCustomCard(w, s) {
  return {
    id: s.q, t: "s", st: "本机篇目", ef: 0,
    cl: s.c, fe: s.e, sw: w.t, pv: "", nx: "", em: "", os: [],
    q: { c: s.e, d: pickDistractors(s.e).map(x => [x, "干扰项来自题库里的其他篇目"]) },
  };
}

/** 存储格式 → 渲染用的 work 对象。ps 是每段句数，m 是逐句白话
 *  （内置篇目里 m 的每一项是 [白话, 是否段级]，新加的按句给，一律 0）。 */
function specToWork(spec) {
  return {
    t: spec.t,
    a: (spec.a || "").trim(),
    lv: 3,                                   // 自加的默认「普通」，可在目录里改档
    ps: (spec.ps && spec.ps.length ? spec.ps : [spec.s.length]).slice(),
    m: spec.s.map(x => [(x.m || "").trim(), 0]),
    s: spec.s.map((x, i) => ({
      c: x.c,
      m: i,
      e: (x.e || "").trim(),
      w: [],                                 // 没有人工校订的词卡
      q: (x.e || "").trim() ? "c" + spec.id + "_" + i : null,
    })),
    custom: true,
  };
}

/** 存盘之后把新篇挂到运行期索引上（不刷新页面就能看到） */
function attachWork(w) {
  WORKS.push(w);
  WORK_BY_NAME.set(w.t, w);
  w.s.forEach((s, i) => {
    if (!s.q) return;
    BY_ID.set(s.q, makeCustomCard(w, s));
    CARD_SENT.set(s.q, [w.t, i]);
  });
  N_ALL_SENT = WORKS.reduce((n, x) => n + x.s.length, 0);
}

function detachWork(name, keepProgress) {
  const i = WORKS.findIndex(w => w.t === name);
  if (i < 0) return;
  const [w] = WORKS.splice(i, 1);
  WORK_BY_NAME.delete(name);
  for (const s of w.s) if (s.q) { BY_ID.delete(s.q); CARD_SENT.delete(s.q); }
  N_ALL_SENT = WORKS.reduce((n, x) => n + x.s.length, 0);
  // 进度、档位、错题本里这篇的痕迹一起清 —— 留着会在统计里变成永远刷不完的幽灵。
  // 编辑保存时传 keepProgress：内容改了但句子顺序没变，刷题记录没必要跟着清零。
  if (!keepProgress) {
    for (const s of w.s) if (s.q) delete S.prog[s.q];
    S.mistakes = S.mistakes.filter(e => BY_ID.has(e.id));
    delete S.wlv[name];
    save();
  }
}


/* ── 工具 ─────────────────────────────────────────────────────── */

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

const $ = sel => document.querySelector(sel);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 卡片统一访问器：词卡/句卡字段不同，这里抹平 */
const isWord = c => c.t === "w";

/** 篇名：接受卡片或字符串，统一取全角「（」之前的书名。
 *  卡片上的 sw 形如「岳阳楼记（《范文正公集》卷七）」，篇目表里只有「岳阳楼记」，
 *  两边必须用同一个口径，否则错题本按篇筛选会一条都筛不出来。 */
const workName = x => {
  const s = typeof x === "string" ? x : (x && x.sw) || "";
  const i = s.indexOf("（");
  return i >= 0 ? s.slice(0, i) : s;
};

/* ── TermLocator：term 在原文中的全部出现范围（含去标点退化） ── */

const PUNCT = new Set("、，。；：！？「」（）『』,. ;:!?()".split(""));

function termRanges(text, term) {
  if (!term) return [];
  const hits = [];
  let from = 0;
  while (true) {
    const i = text.indexOf(term, from);
    if (i < 0) break;
    hits.push([i, i + term.length]);
    from = i + term.length;
  }
  if (hits.length) return hits;

  // 退化：剔除标点后再找，映射回原串
  const kept = [];
  for (let i = 0; i < text.length; i++) if (!PUNCT.has(text[i])) kept.push(i);
  const stripped = kept.map(i => text[i]).join("");
  const strippedTerm = [...term].filter(ch => !PUNCT.has(ch)).join("");
  if (!strippedTerm) return [];
  const j = stripped.indexOf(strippedTerm);
  if (j < 0) return [];
  return [[kept[j], kept[j + strippedTerm.length - 1] + 1]];
}

/** 把原文中所有 term 出现处包成下划线 span（html 已转义） */
function markTerm(text, term) {
  const ranges = termRanges(text, term);
  if (!ranges.length) return esc(text);
  let out = "", last = 0;
  for (const [s, e] of ranges) {
    out += esc(text.slice(last, s)) + '<span class="term-u">' + esc(text.slice(s, e)) + "</span>";
    last = e;
  }
  return out + esc(text.slice(last));
}

/* ── 逐词切分（点词查词典用） ───────────────────────────────── */

/** 正则必须与 scripts/build_dict.py 里的 WORD_RE 逐字一致。
 *  漏连字符：thousand-li 会被切成两个半词，两边都查不到；
 *  漏撇号：Zhao's 永远查不出 Zhao。这类错最难查，所以两个文件各写一份，
 *  check_mobile.py 把两边的源串取出来比对。 */
const WORD_RE = /[A-Za-z]+(?:['\u2019-][A-Za-z]+)*/g;

/** 片段首次出现的区间。用偏移而不是切好的 HTML —— 对 HTML 做 slice 会切断标签 */
function rangesOf(full, frag) {
  if (!frag) return [];
  const i = full.indexOf(frag);
  return i < 0 ? [] : [[i, i + frag.length]];
}

/** 把纯文本切成 <span class="w">，命中区间在外层包一条连续的 .hl。
 *  为什么不先切 HTML 再切词：会切断标签。
 *  为什么不先 esc 再算偏移：' 会变成 &#39;，偏移全错、整句错位。
 *  所以全程在原始字符串上按字符位置拼，只在输出每一小段时转义一次。 */
function wrapWords(text, ranges) {
  const start = new Map(), end = new Map();
  for (const [s, e] of ranges || []) {
    start.set(s, (start.get(s) || 0) + 1);
    end.set(e, (end.get(e) || 0) + 1);
  }
  let out = "", i = 0;
  const closeAt = pos => { for (let n = end.get(pos) || 0; n > 0; n--) out += "</span>"; };
  while (i < text.length) {
    closeAt(i);                                   // 先关掉在上一个字符处结束的高亮
    for (let n = start.get(i) || 0; n > 0; n--) out += '<span class="hl">';
    WORD_RE.lastIndex = i;
    const m = WORD_RE.exec(text);
    if (m && m.index === i) {
      const w = esc(m[0]);
      out += '<span class="w" data-act="word" data-w="' + w + '">' + w + "</span>";
      i += m[0].length;
    } else {
      out += esc(text[i]);
      i++;
    }
  }
  closeAt(text.length);
  return out;
}

/** ui_spec §3.5 规则 4：片段只高亮首个匹配（现在是逐词版，每个词都能点） */
const highlightFirst = (full, frag) => wrapWords(full || "", rangesOf(full || "", frag));

/** ui_spec §3.2：>400 字符的译文按 .!? 切句（U6）
 *  返回 [{t: 文本, s: 在原串中的起始偏移}]，偏移是为了逐词切分时能对齐。 */
function splitLongEnglish(full) {
  if ([...full].length <= 400) return [{ t: full, s: 0 }];
  const segs = [];
  let start = 0;
  for (let i = 0; i < full.length; i++) {
    if (".!?".includes(full[i])) { segs.push([start, i + 1]); start = i + 1; }
  }
  if (start < full.length) segs.push([start, full.length]);
  return segs.map(([s, e]) => {
    const raw = full.slice(s, e);
    const lead = raw.length - raw.trimStart().length;   // 段首空格不算进偏移
    return { t: raw.trim(), s: s + lead };
  }).filter(x => x.t);
}

/* ── 进度状态与持久化 ─────────────────────────────────────────── */

const STORE_KEY = "guwen.web.v" + DATA.v;
/* v6 → v7 的一次性迁移。v7 只是多了 works 这个只读字段、卡片 id 一张没变，
   所以旧进度可以整份沿用，不能因为它换了个键就把人家刷过的记录清零。 */
const PREV_KEY = "guwen.web.v" + (DATA.v - 1);
const BLANK = () => ({ status: "new", cc: 0, att: 0, ok: 0, seen: null });

let S = loadState();

function loadState() {
  const base = { prog: {}, mistakes: [], ratio: 0.6, theme: "auto", wlv: {}, wstar: {}, say: "auto" };
  try {
    let raw = localStorage.getItem(STORE_KEY);
    let migrated = false;
    if (!raw) {
      raw = localStorage.getItem(PREV_KEY);
      migrated = !!raw;
    }
    if (!raw) return base;
    const o = JSON.parse(raw);
    const st = Object.assign(base, o);
    st.wlv = st.wlv || {};
    st.wstar = st.wstar || {};
    st.say = st.say || "auto";
    if (migrated) localStorage.setItem(STORE_KEY, JSON.stringify(st));
    return st;
  } catch { return base; }
}

/** 只读地判断「这张卡答过没有」。
 *  这里**不能**用 stateOf()：它会往 S.prog 里塞一条空记录，
 *  目录页每渲染一次就灌进 654 条，几次之后 localStorage 就被垃圾撑满了。 */
const touched = id => ((S.prog[id] || {}).att || 0) > 0;

/** 这一句刷过没有：该句下任意一张卡答过就算 */
function sentDone(w, i) {
  const s = w.s[i];
  return (s.w || []).concat(s.q ? [s.q] : []).some(touched);
}

/** 全库已刷句数（首页与目录都用它） */
function doneSentTotal() {
  let n = 0;
  for (const w of WORKS) for (let i = 0; i < w.s.length; i++) if (sentDone(w, i)) n++;
  return n;
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {}
}
const stateOf = id => S.prog[id] || (S.prog[id] = BLANK());

/** learning 卡是否到期（引擎 §2.4，阶梯 [10min,1d,3d]） */
function isDue(st, now) {
  if (st.status !== "learning" || !st.seen) return false;
  const gap = st.cc === 0 ? 10 * 60e3 : st.cc === 1 ? 86400e3 : 3 * 86400e3;
  return now >= st.seen + gap;
}
const errorRate = st => st.att > 0 ? (st.att - st.ok) / st.att : 0;

function recordAnswer(card, isCorrect, countsTowardStatus) {
  const st = stateOf(card.id);
  st.att++;
  if (isCorrect) st.ok++;
  if (countsTowardStatus) {
    st.status = "learning";
    st.cc = isCorrect ? st.cc + 1 : 0;
    st.seen = Date.now();
    if (st.cc >= 3) st.status = "mastered";
  }
  save();
}

function statusCounts() {
  const c = { new: 0, learning: 0, mastered: 0 };
  for (const card of CARDS) c[stateOf(card.id).status]++;
  return c;
}
const totalAttempts = () => Object.values(S.prog).reduce((s, x) => s + x.att, 0);

/* ── Scheduler：抽题（learning_engine.md §8） ─────────────────── */

function weighted(cards) {
  return cards.map(card => {
    const st = stateOf(card.id);
    const w = (st.att >= 3 && errorRate(st) > 0.5) ? 2 : 1;
    return [card, w];
  });
}

function sampleWeighted(items, n) {
  if (n <= 0) return [];
  const pool = items.slice();
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, p) => s + p[1], 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < pool.length; i++) { r -= pool[i][1]; if (r <= 0) { idx = i; break; } }
    out.push(pool.splice(idx, 1)[0][0]);
  }
  return out;
}

function pickRound(wordRatio) {
  const now = Date.now();
  const nWord = Math.round(20 * wordRatio);
  const nSent = 20 - nWord;

  const pool = (type, pred) => CARDS.filter(c => c.t === type && pred(stateOf(c.id)));

  const newWord = pool("w", s => s.status === "new");
  const newSent = pool("s", s => s.status === "new");
  const dueWord = pool("w", s => isDue(s, now));
  const dueSent = pool("s", s => isDue(s, now));

  // 前 5 题：new 打头（3 词 + 2 句）
  let round = [];
  round = round.concat(sampleWeighted(weighted(newWord), Math.min(3, nWord)));
  round = round.concat(sampleWeighted(weighted(newSent), Math.min(2, nSent)));

  const cnt = (arr, t) => arr.filter(c => c.t === t).length;
  const tailWord = Math.max(0, nWord - cnt(round, "w"));
  const tailSent = Math.max(0, nSent - cnt(round, "s"));

  let tail = [];
  tail = tail.concat(sampleWeighted(weighted(dueWord), tailWord));
  tail = tail.concat(sampleWeighted(weighted(dueSent), tailSent));

  const used = new Set(round.concat(tail).map(c => c.id));
  const coldStart = dueWord.length === 0 && dueSent.length === 0;

  if (coldStart) {
    // 一张到期卡都没有（首轮必然如此）：按比例把 new 补满，否则凑不满 20 题
    const needW = Math.max(0, nWord - cnt(round, "w") - cnt(tail, "w"));
    const needS = Math.max(0, nSent - cnt(round, "s") - cnt(tail, "s"));
    for (const c of sampleWeighted(weighted(newWord.filter(x => !used.has(x.id))), needW)) { tail.push(c); used.add(c.id); }
    for (const c of sampleWeighted(weighted(newSent.filter(x => !used.has(x.id))), needS)) { tail.push(c); used.add(c.id); }
  } else {
    const shortage = tailWord + tailSent - tail.length;
    if (shortage > 0) {
      const newPool = shuffle(newWord.concat(newSent).filter(c => !used.has(c.id)));
      for (const c of newPool.slice(0, Math.min(3, shortage))) { tail.push(c); used.add(c.id); }
    }
  }

  // 仍不足 → mastered 按考频补位（不计状态流转）
  const fillIDs = new Set();
  const stillShort = tailWord + tailSent - tail.length;
  if (stillShort > 0) {
    const excluded = new Set(round.concat(tail).map(c => c.id));
    const mastered = CARDS
      .filter(c => stateOf(c.id).status === "mastered" && !excluded.has(c.id))
      .sort((a, b) => b.ef - a.ef)
      .slice(0, stillShort);
    for (const c of mastered) { tail.push(c); fillIDs.add(c.id); }
  }
  round = round.concat(tail);

  // 多字词保底：char_count ≥ 2 的词题 ≥ 3（R6）
  if (round.filter(c => isWord(c) && (c.cc || 0) >= 2).length < 3) {
    const excluded = new Set(round.map(c => c.id));
    const cand = CARDS.filter(c => isWord(c) && (c.cc || 0) >= 2 && !excluded.has(c.id));
    const due = cand.filter(c => isDue(stateOf(c.id), now)).sort((a, b) => b.ef - a.ef);
    const fresh = cand.filter(c => stateOf(c.id).status === "new").sort((a, b) => b.ef - a.ef);
    const mast = cand.filter(c => stateOf(c.id).status === "mastered").sort((a, b) => b.ef - a.ef);
    const queue = due.concat(fresh, mast);
    const singles = round.map((c, i) => [c, i])
      .filter(([c]) => isWord(c) && (c.cc || 0) === 1)
      .sort((a, b) => a[0].ef - b[0].ef);
    for (const [, idx] of singles) {
      if (!queue.length) break;
      round[idx] = queue.shift();
      if (round.filter(c => isWord(c) && (c.cc || 0) >= 2).length >= 3) break;
    }
  }

  // 轮内去重
  const seen = new Set();
  round = round.filter(c => { if (seen.has(c.id)) return false; seen.add(c.id); return true; });

  // 前 5 保持，其余打乱
  return { round: round.slice(0, 5).concat(shuffle(round.slice(5))), fillIDs };
}

/* ── 篇内出题：按原文句序，不洗牌 ─────────────────────────────
   随机模式刻意打散，篇内正好相反：「一句一句刷完一整篇」要求顺序是文本顺序，
   不然读到第三句又跳回第一句，看不出进度。
   选项本身仍然洗牌（optionsFor 负责），那不影响阅读顺序。             */
function buildWorkRound(name, limit = 20) {
  const w = WORK_BY_NAME.get(name);
  if (!w) return { round: [], fillIDs: new Set() };

  // 从第一句还没刷过的开始；整篇都刷完了就从第一句重来（二刷）
  let start = w.s.findIndex((_, i) => !sentDone(w, i));
  if (start < 0) start = 0;

  const round = [];
  for (let i = start; i < w.s.length && round.length < limit; i++) {
    const s = w.s[i];
    for (const id of (s.w || [])) {
      if (round.length >= limit) break;
      const c = BY_ID.get(id);
      if (c) round.push(c);
    }
    if (s.q && round.length < limit) {
      const c = BY_ID.get(s.q);
      if (c) round.push(c);
    }
  }
  return { round, fillIDs: new Set() };
}

/** 当前卡所属的那句的白话。返回 null 表示这张卡不在任何篇里 */
function modernOf(card) {
  const at = CARD_SENT.get(card.id);
  if (!at) return null;
  const w = WORK_BY_NAME.get(at[0]);
  if (!w) return null;
  const s = w.s[at[1]];
  const blk = w.m[s.m];
  if (!blk || !blk[0]) return null;
  return { text: blk[0], scope: blk[1] ? "段" : "句" };
}

/* ══════════════════════════════════════════════════════════════
   点词词典：离线释义 + 联网优先真人发音
   ══════════════════════════════════════════════════════════════ */

/** dict.js 是一整串 "word\tipa\tpos\tgloss\tlemma"。首次查词时才拆成 Map：
 *  启动时拆没意义（3ms 换不来什么），而首屏对弱网才是痛点。 */
let DICT = null;
function dictMap() {
  if (DICT) return DICT;
  DICT = new Map();
  const raw = (window.GUWEN_DICT && window.GUWEN_DICT.raw) || "";
  if (!raw) return DICT;          // dict.js 没加载 → 一律「未收录」，但绝不白屏
  for (const line of raw.split("\n")) {
    if (!line) continue;
    const p = line.split("\t");
    if (!p[0]) continue;
    DICT.set(p[0], { ipa: p[1] || "", pos: p[2] || "", gloss: p[3] || "", base: p[4] || "" });
  }
  return DICT;
}

/** 查词。命中不到就回 null，由调用方显示「未收录」。 */
function lookupWord(word) {
  const m = dictMap();
  const k = String(word || "").toLowerCase();
  const hit = m.get(k) || m.get(/['\u2019]s$/.test(k) ? k.replace(/['\u2019]s$/, "") : k);
  if (!hit) return null;
  return { base: hit.base || "", ipa: hit.ipa, pos: hit.pos, gloss: hit.gloss };
}

const SAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/>'
  + '<path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const STAR_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M12 4.6l2.3 4.7 5.2.8-3.8 3.6.9 5.2-4.6-2.4-4.6 2.4.9-5.2L4.5 10l5.2-.8z"/></svg>';

let TIP = null;

function closeTip() {
  if (!TIP) return;
  TIP.remove();
  TIP = null;
}

/** 点词浮卡。
 *  不复用 SHEET：SHEET 的唯一出路是 render() 全量重绘，而 .cover 挂着
 *  slide 进场动画 —— 点一个词整个答案页横滑一次，很荒唐。
 *  坐标必须在 click 当场快照：重绘后原节点就不存在了。
 *  #phone 是 position:relative，所以 left 要减掉它的视口偏移（桌面端被居中）。 */
function openWordTip(node) {
  const word = (node.dataset.w || "").trim();
  if (!word) return;
  closeTip();

  const hit = lookupWord(word);
  const star = !!(S.wstar && S.wstar[word.toLowerCase()]);
  // 高亮区间里的那个词就是本题考的英文片段，顺手把本句义带出来
  const inHl = !!(node.parentElement && node.parentElement.classList.contains("hl"));
  const card = SESSION ? curCard() : null;
  const cur = inHl && card && isWord(card) && card.m
    ? `<div class="gw-cur">本句：${esc(card.tm)} — ${esc(card.m)}</div>` : "";

  const tip = document.createElement("div");
  tip.className = "gw-tip";
  tip.innerHTML = `
    <div class="gw-hd">
      <span class="gw-w">${esc(word)}</span>
      <button class="gw-ic ${star ? "on" : ""}" data-act="star" data-w="${esc(word)}" aria-label="收藏">${STAR_ICON}</button>
      <span class="gw-tag">详细释义</span>
    </div>
    <div class="gw-ipa">
      <button class="gw-ic" data-act="say" data-w="${esc(word)}" aria-label="发音">${SAY_ICON}</button>
      <span>${hit && hit.ipa ? esc(hit.ipa) : ""}</span>
      ${hit && hit.base ? `<span style="opacity:.8">原形 ${esc(hit.base)}</span>` : ""}
    </div>
    ${hit
      ? `<div class="gw-body">${hit.pos ? `<span class="gw-pos">${esc(hit.pos)}</span>` : ""}<span>${esc(hit.gloss)}</span></div>`
      : '<div class="gw-none">词典暂未收录这个词</div>'}
    ${cur}`;

  const r = node.getBoundingClientRect();
  const pr = $("#phone").getBoundingClientRect();
  $("#phone").appendChild(tip);

  const w = tip.offsetWidth || 260;
  let left = r.left + r.width / 2 - w / 2 - pr.left;
  left = Math.max(8, Math.min(left, pr.width - w - 8));      // 贴边时夹住，别被裁掉
  tip.style.left = left + "px";

  const h = tip.offsetHeight;
  const above = r.top - pr.top - h - 8;
  const flip = above < 8;                                     // 词在第一行时上方放不下
  const top = flip ? Math.min(r.bottom - pr.top + 8, pr.height - h - 8) : above;
  tip.style.top = Math.max(8, top) + "px";

  requestAnimationFrame(() => tip.classList.add("in"));
  TIP = tip;
}

/* ── 发音：联网真人音 → 系统 TTS → 只剩音标 ─────────────────── */

const SAY_SRC = w => "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(w) + "&type=2";

let sayAudio = null, sayVoice = null, sayWarmed = false;

/** iOS 第一次 getVoices() 返回空数组，要听 voiceschanged 才能拿到音色 */
function pickVoice() {
  if (!window.speechSynthesis) return null;
  const vs = window.speechSynthesis.getVoices() || [];
  return vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}

function speakTTS(word, why) {
  if (!window.speechSynthesis || typeof SpeechSynthesisUtterance !== "function") {
    window.__say = { last: "none", word };
    return;
  }
  window.__say = { last: "tts", word, why: why || "" };
  try {
    const u = new SpeechSynthesisUtterance(word);
    u.lang = "en-US";
    u.rate = 0.9;
    if (!sayVoice) sayVoice = pickVoice();
    if (sayVoice) u.voice = sayVoice;
    window.speechSynthesis.speak(u);
  } catch {}
}

/** 点喇叭。三级回退，任何一级失败都静默降级，不弹错误。
 *  1.2 秒超时是必须的：play() 的 Promise 在网络慢时可能很久不 settle，
 *  这期间界面上什么都没发生，看着就像按钮坏了；而超时后音频若再响起来，
 *  会和 TTS 撞在一起，所以回退前先 pause。 */
function say(word) {
  if (!word) return;
  // 单例：真人音和机器音叠着响，是这套方案最容易出的丑
  if (sayAudio) { try { sayAudio.pause(); sayAudio.currentTime = 0; } catch {} }
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch {} }

  if (S.say === "tts" || typeof Audio !== "function") return speakTTS(word, "off");

  const a = new Audio();
  a.preload = "auto";
  a.src = SAY_SRC(word);
  sayAudio = a;

  let settled = false;
  const fell = why => {
    if (settled) return;
    settled = true;
    try { a.pause(); } catch {}
    speakTTS(word, why);
  };
  const timer = setTimeout(() => fell("timeout"), 1200);
  a.play().then(() => {
    clearTimeout(timer);
    if (settled) { try { a.pause(); } catch {} return; }   // 已回退，别再叠一层
    settled = true;
    window.__say = { last: "online", word };
  }).catch(() => { clearTimeout(timer); fell("error"); });
}

function toggleStar(btn) {
  const w = (btn.dataset.w || "").toLowerCase();
  if (!w) return;
  S.wstar = S.wstar || {};
  if (S.wstar[w]) delete S.wstar[w]; else S.wstar[w] = 1;
  save();
  btn.classList.toggle("on", !!S.wstar[w]);
}

function newSession(mode, round, fillIDs, work = null) {

function optionsFor(card) {

}

const app = $("#app");

function render() {
  closeTip();     // 全量重绘会把浮卡的定位基准一起换掉，先收掉最省事
  // 做题流程是全屏覆盖层，弹层（退出确认）要盖在它上面，所以两条分支都得拼 SHEET
  if (SESSION) {
    app.innerHTML = renderCover() + (SHEET ? renderSheet() : "");
    return;
  }
  let body;
  if (TAB === "home") body = renderHome();
  else if (TAB === "catalog") body = CUSTOM_SCREEN ? renderCustomForm() : (WORK ? renderWorkDetail(WORK) : renderCatalog());
  else body = renderMistakes();
  app.innerHTML = body + renderTabbar() + (SHEET ? renderSheet() : "");
  // 表单页不能全量重绘，输入靠这里一次性挂监听
  if (CUSTOM_SCREEN) bindCustomForm();
}

/** 切页淡入：重绘后挂一个用完即摘的 class。
 *  只在「切 Tab / 从首页进目录」这类真正的页面切换时调用，开弹层、改主题不调 ——
 *  否则那些局部更新也会让整页闪一下。 */
let enterTimer = 0;
function renderEnter() {
  render();
  app.classList.remove("entering");
  void app.offsetWidth;      // 强制回流，否则连续两次加同一个 class 不会重启动画
  app.classList.add("entering");
  clearTimeout(enterTimer);
  enterTimer = setTimeout(() => app.classList.remove("entering"), 260);
}

/* ── 首页（HomeView） ───────────────────────────────────────── */

/* ── 错题本（MistakeBookView） ──────────────────────────────── */

function renderMistakes() {
  const all = S.mistakes;
  const list = FILTER_WORK ? all.filter(e => (BY_ID.get(e.id)?.sw || "").startsWith(FILTER_WORK)) : all;
  const works = [...new Set(all.map(e => workName(BY_ID.get(e.id) || {})))].filter(Boolean);

  if (!all.length) {
    return `
    <div class="navbar"><b>错题本</b><span>共 0 条</span></div>
    <div class="empty">
      <div class="illust">
        <div class="mtn"><i></i><i></i></div>
        <div class="flame"></div><div class="candle"></div>
        <div class="scroll"></div>
      </div>
      <div style="text-align:center">
        <div class="m1">还没有错题，继续做题吧</div>
        <div class="m2" style="margin-top:6px">答案页可随时把题目收进来</div>
      </div>
    </div>`;
  }

  return `
  <div class="navbar">
    <button class="nav-btn" data-act="filter">${esc(FILTER_WORK ? workName(FILTER_WORK) : "全部")} ▾</button>
    <span>共 ${list.length} 条</span>
  </div>
  <div class="scroll page" style="padding-top:0">
    <div class="mlist">
      ${list.map(e => {
        const card = BY_ID.get(e.id);
        if (!card) return "";
        return `<div class="mrow">
          <span class="badge ${isWord(card) ? "w" : "s"}">${isWord(card) ? "文" : "句"}</span>
          <div class="body">
            <div class="cl">${esc(card.cl)}</div>
            <div class="meta">${esc(card.sw || "")}</div>
            <div class="meta">${relTime(e.at)}加入</div>
          </div>
          <div class="ops">
            <button class="mini" data-act="retrain" data-id="${card.id}">再练</button>
            <button class="mini del" data-act="undel" data-id="${card.id}">删除</button>
          </div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function relTime(ts) {
  const d = Date.now() - ts;
  if (d < 60e3) return "刚刚";
  if (d < 3600e3) return Math.floor(d / 60e3) + " 分钟前";
  if (d < 86400e3) return Math.floor(d / 3600e3) + " 小时前";
  return Math.floor(d / 86400e3) + " 天前";
}

/* ── 做题流程外壳 ──────────────────────────────────────────── */

function renderCover() {
  if (SCREEN === "answer") return renderAnswer();
  if (SCREEN === "summary") return renderSummary();
  return renderQuiz();
}

/** 顶部标题栏文案：三种轮次口径不同 */
function roundHead() {
  const total = SESSION.round.length;
  if (SESSION.mode === "retrain") return "错题再练";
  if (SESSION.mode === "work") return `${SESSION.work} · ${SESSION.idx + 1}/${total}`;
  return `第 ${SESSION.idx + 1}/${total} 题`;
}

/* 页面一：选择题（QuizView §2） */
function renderQuiz() {
  const card = curCard();
  if (!card) {
    return `<div class="cover" style="align-items:center;justify-content:center;gap:16px">
      <p>本轮已结束</p><div style="width:200px"><button class="btn-fill" data-act="home">回首页</button></div>
    </div>`;
  }
  const ranges = isWord(card) ? termRanges(card.cl, card.tm) : [];
  const total = SESSION.round.length;
  const head = roundHead();

  return `
  <div class="cover">
    <div class="navbar">
      <b>${esc(head)}</b>
      <button class="nav-btn" data-act="exit">退出</button>
    </div>
    ${SESSION.mode !== "retrain"
      ? `<div class="segbar">${Array.from({ length: total }, (_, i) =>
          `<i class="${i < SESSION.idx ? "on" : ""}"></i>`).join("")}</div>`
      : ""}
    <div class="scroll" style="padding:0 var(--pad)">
      <div class="stack" style="gap:24px;padding-top:8px">
        <div>
          ${isWord(card) && ranges.length ? '<div class="hint-line">选出划线词的释义</div>' : ""}
          <div class="stem">${isWord(card) ? markTerm(card.cl, card.tm) : esc(card.cl)}</div>
        </div>
        <div style="padding-bottom:24px">
          ${optionsFor(card).map((t, i) => {
            const sel = SESSION.selected === t;
            return `<button class="opt ${sel ? "sel" : ""}" data-act="pick" data-t="${esc(t)}" ${SESSION.locked ? "disabled" : ""}>
              <span class="t">${esc(t)}</span></button>`;
          }).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

/* 页面二：答案（AnswerView §3） */
function renderAnswer() {
  const card = curCard();
  if (!card) return "";
  const quiz = card.q;
  const selected = SESSION.selected;
  const opts = optionsFor(card);
  const ranges = isWord(card) ? termRanges(card.cl, card.tm) : [];
  const head = roundHead();

  // 英译区：逐词切成可点的 span，命中片段整体高亮
  let enHtml = "";
  if (isWord(card)) {
    enHtml = `<div class="en">${highlightFirst(card.fe || "", card.te || "")}</div>`;
  } else {
    const lines = splitLongEnglish(card.fe || "");
    enHtml = lines.length > 1
      ? `<div class="en-lines">${lines.map(l => `<p>${wrapWords(l.t, [])}</p>`).join("")}</div>`
      : `<div class="en en-block">${wrapWords(lines.length ? lines[0].t : (card.fe || ""), [])}</div>`;
  }

  // 释义卡
  let infoHtml = "";
  if (isWord(card)) {
    const notFound = ranges.length === 0;
    infoHtml = `
      <div class="card">
        <div class="row"><span class="badge w">文</span>${esc(card.tm)}</div>
        ${notFound ? `<div class="kv"><div class="k" style="color:var(--error)">原句写作『${esc(card.tm)}』（含标点变化，未加下划线）</div></div>` : ""}
        ${card.m ? kv("本句义", card.m) : ""}
        ${card.os && card.os.length ? kv("其他义项", card.os.join("；")) : ""}
        ${card.em ? kv("常见错法", card.em) : ""}
      </div>`;
  } else {
    const d = quiz.d.find(x => x[0] === selected);
    infoHtml = `
      <div class="card">
        <div class="row"><span class="badge s">句</span>${esc(card.st || "")}
          <span style="font-size:13px;color:var(--text-2)">考频 ${card.ef || 0}</span></div>
        ${d && d[1] ? kv("干扰项解析", d[1]) : ""}
      </div>`;
  }

  const inBook = S.mistakes.some(e => e.id === card.id);

  // 白话（现代汉语）。英文看不明白就往下看一行中文，所以紧跟英译。
  // 有 217 句的数据只有整段白话，标签写「本段白话」而不是「本句白话」——
  // 标错了比不标更让人困惑。
  const zh = modernOf(card);
  const zhHtml = zh
    ? `<div class="zh"><div class="zh-k">${zh.scope === "段" ? "本段白话" : "本句白话"}</div>` +
      `<div class="zh-v">${esc(zh.text)}</div></div>`
    : "";

  return `
  <div class="cover">
    <div class="navbar">
      <b>${esc(head)}</b>
      <button class="nav-btn solid" data-act="exit">退出</button>
    </div>
    <div class="scroll">
      <div class="stack" style="gap:16px;padding:0 var(--pad) 24px">
        <div class="stem left">${isWord(card) ? markTerm(card.cl, card.tm) : esc(card.cl)}</div>
        <div>${opts.map(t => {
          let cls = "dim", mk = "";
          if (t === quiz.c) { cls = "correct"; mk = '<span class="mk ok">✓</span>'; }
          else if (t === selected) { cls = "wrong"; mk = '<span class="mk no">✕</span>'; }
          return `<div class="opt ${cls}"><span class="t">${esc(t)}</span>${mk}</div>`;
        }).join("")}</div>
        ${enHtml}
        ${zhHtml}
        ${infoHtml}
        <div class="src">
          <div>${esc(card.sw || "")}</div>
          ${card.pv ? `<p data-act="ctx">前：${esc(card.pv)}</p>` : ""}
          ${card.nx ? `<p data-act="ctx">后：${esc(card.nx)}</p>` : ""}
        </div>
      </div>
    </div>
    <div class="actionbar">
      <button class="btn-line" data-act="addbook" ${inBook ? "disabled" : ""}>${inBook ? "已加入" : "加入错题本"}</button>
      <button class="btn-fill" data-act="next">${nextLabel()}</button>
    </div>
  </div>`;
}

/** 答案页主按钮文案：最后一题不该还写「下一题」，否则用户以为还有题 */
function nextLabel() {
  if (SESSION.mode === "retrain") return "完成";
  if (SESSION.idx + 1 < SESSION.round.length) return "下一题";
  return SESSION.mode === "work" ? "完成本篇" : "看小结";
}

function kv(k, v) {
  return `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`;
}

/* ── 篇章目录 ───────────────────────────────────────────────── */

const LV_NAME = { 1: "重点", 2: "次重点", 3: "普通" };
/** 档位：用户手动改过的优先，否则用构建脚本按考频排出来的默认档 */
const lvOf = w => S.wlv[w.t] || w.lv;

function renderCatalog() {

  const groups = [1, 2, 3].map(lv => [lv, WORKS.filter(w => lvOf(w) === lv)]);

  <div class="navbar"><b>古文目录</b><span>已刷 ${done}/${N_ALL_SENT} 句</span>

    ${groups.map(([lv, ws]) => ws.length ? `
      <div class="grp">${LV_NAME[lv]} · ${ws.length} 篇</div>
      ${ws.map(w => {

/** 目录底部的说明只在「还没加过任何本机篇目」时出现，
 *  作用是把「＋ 是什么、数据存在哪」一次说清，之后就别再占地方。
 *  措辞刻意收紧成「临时篇目」：＋ 只写本机，正式进题库走的是离线入库那条路，
 *  两者能力差一截（有没有词卡、换设备还在不在），文案不能含糊。 */
function customHint() {
  if (WORKS.some(w => w.custom)) return "";
  return `<p class="footnote" style="margin:18px 0 0;line-height:1.7">
     右上角 ＋ 是临时篇目：只存在这台手机上，清缓存会丢。<br>
     要正式收进题库，需另外入库。</p>`;
}

/* ── 篇详情：整篇原文 + 通读 / 刷题 ─────────────────────────── */

function renderWorkDetail(name) {
  const w = WORK_BY_NAME.get(name);
  if (!w) { WORK = null; return renderCatalog(); }
  const n = w.s.length;
  const done = w.s.filter((_, i) => sentDone(w, i)).length;
  const pct = n ? Math.round(done * 100 / n) : 0;
  const nQ = w.s.reduce((k, s) => k + (s.w || []).length + (s.q ? 1 : 0), 0);

  // 按段切：ps 是每段句数。不用 para_index —— 出师表那列跳号（缺 5、6）
  let p = 0;
  const paras = w.ps.map(cnt => {
    const from = p;
    p += cnt;
    return w.s.slice(from, p).map((s, k) => {
      const i = from + k;
      return `<span class="sl ${sentDone(w, i) ? "done" : ""}" data-act="sent" data-i="${i}">${esc(s.c)}</span>`;
    }).join("");
  });

  const body = WMODE === "read"
    ? `<div class="pbar" style="margin:2px 0 14px"><i style="width:${pct}%"></i></div>
       <div class="legend" style="margin-bottom:14px">
         <span><i style="background:var(--text-2)"></i>未刷</span>
         <span><i style="background:var(--text-1)"></i>已刷</span>
         <span>点句子看白话与英译</span>
       </div>
       <div class="worktext">${paras.map(x => `<p>${x}</p>`).join("")}</div>`
    : `<div class="card" style="gap:10px">
         <div class="hd" style="font-size:16px;font-weight:500">本篇进度</div>
         <div class="statline">${stat(done, "已刷句数")}${stat(n - done, "待刷句数")}${stat(nQ, "可练题目")}</div>
         <div class="pbar" style="margin-top:2px"><i style="width:${pct}%"></i></div>
       </div>
       <p class="footnote" style="margin:16px 0 0">
         一轮最多 20 题，按原文顺序出，从第一句还没刷过的开始。${nQ > 20 ? "长篇会分几轮刷完。" : ""}
       </p>`;

  return `
  <div class="navbar">
    <button class="nav-btn" data-act="backcatalog">‹ 目录</button>
    <span>已刷 ${done}/${n} 句</span>
    ${w.custom ? `<button class="nav-btn" data-act="workmenu" data-w="${esc(w.t)}" aria-label="更多">⋯</button>` : ""}
  </div>
  <div class="scroll page" style="padding-top:0">
    <h2 class="title" style="font-size:26px;margin:2px 0 2px">${esc(w.t)}</h2>
    <p class="subtitle" style="margin:0 0 16px">${esc(w.a || "")} · ${w.ps.length} 段 · ${n} 句</p>
    <div class="seg-ctl" style="margin-bottom:18px">
      <button data-act="wmode" data-v="read" class="${WMODE === "read" ? "on" : ""}">通读</button>
      <button data-act="wmode" data-v="quiz" class="${WMODE === "quiz" ? "on" : ""}">刷题</button>
    </div>
    ${body}
    <div style="height:8px"></div>
  </div>
  <div class="actionbar">
    <button class="btn-fill" data-act="wstart" ${nQ ? "" : "disabled"}>${
      nQ ? (done ? "继续刷本篇" : "开始刷本篇") : "本篇暂无可练习题"}</button>
  </div>`;
}

/* ── 添加 / 编辑本机篇目 ─────────────────────────────────────── */

let CUSTOM_SCREEN = null;    // null | "new" | "edit"
let CUSTOM_DRAFT = null;     // {id?, t, a, c, m, e}
let CUSTOM_EDIT_T = null;    // 编辑前的篇名，改完要先把旧的那篇摘掉

/** 非空行。三栏对齐的判定标准就靠它 —— 空行只用来分段，不参与对齐，
 *  这样用户在白话栏里照抄原文的分段空行也不会被判「行数不对」。 */
const linesOf = txt => String(txt || "").split("\n").map(x => x.trim()).filter(Boolean);

/** 原文按空行分段 → 每段几句。ps 就是渲染时切段用的那个数组 */
function paraCounts(raw) {
  const out = [];
  let cur = 0;
  for (const line of String(raw || "").split("\n")) {
    if (!line.trim()) { if (cur) { out.push(cur); cur = 0; } continue; }
    cur++;
  }
  if (cur) out.push(cur);
  return out.length ? out : [0];
}

function openCustomForm(spec) {
  if (spec) {
    // 编辑：按原来的段结构还原成「空行分段」的文本，不然一进编辑页段就全并成一段了
    let p = 0;
    const blocks = (spec.ps || [spec.s.length]).map(cnt => {
      const part = spec.s.slice(p, p + cnt).map(x => x.c);
      p += cnt;
      return part.join("\n");
    });
    CUSTOM_SCREEN = "edit";
    CUSTOM_EDIT_T = spec.t;
    CUSTOM_DRAFT = {
      id: spec.id, t: spec.t, a: spec.a || "",
      c: blocks.join("\n\n"),
      m: spec.s.map(x => x.m || "").join("\n"),
      e: spec.s.map(x => x.e || "").join("\n"),
    };
  } else {
    CUSTOM_SCREEN = "new";
    CUSTOM_EDIT_T = null;
    CUSTOM_DRAFT = { t: "", a: "", c: "", m: "", e: "" };
  }
  render();
}

function renderCustomForm() {
  const d = CUSTOM_DRAFT || { t: "", a: "", c: "", m: "", e: "" };
  const isEdit = CUSTOM_SCREEN === "edit";
  const nC = linesOf(d.c).length;
  const cnt = (k, txt, bad) => `<em data-n="${k}" class="${bad ? "bad" : ""}">${txt}</em>`;
  return `
  <div class="navbar">
    <button class="nav-btn" data-act="cancelcustom">‹ 取消</button>
    <span>${isEdit ? "编辑篇目" : "添加篇目"}</span>
    <button class="nav-btn solid" data-act="savecustom">保存</button>
  </div>
  <div class="scroll page" style="padding-top:0">
    <label class="f-lb" for="f-t">篇名</label>
    <input class="f-in" id="f-t" data-f="t" value="${esc(d.t)}" placeholder="如 岳阳楼记"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <label class="f-lb" for="f-a">作者 / 出处<em>选填</em></label>
    <input class="f-in" id="f-a" data-f="a" value="${esc(d.a)}" placeholder="如 范仲淹"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="f-hint">三栏都按「一句一行」。原文里用<b>空行分段</b>；
      白话、英译与原文的句数要一致，整栏留空表示不填。</p>

    <label class="f-lb" for="f-c">原文${cnt("c", nC + " 句", false)}</label>
    <textarea class="f-tx" id="f-c" data-f="c" placeholder="庆历四年春，滕子京谪守巴陵郡。&#10;越明年，政通人和，百废具兴。">${esc(d.c)}</textarea>

    <label class="f-lb" for="f-m">白话${cnt("m", linesOf(d.m).length ? linesOf(d.m).length + " 行" : "未填",
      linesOf(d.m).length && linesOf(d.m).length !== nC)}</label>
    <textarea class="f-tx" id="f-m" data-f="m" placeholder="每行对应一句的白话">${esc(d.m)}</textarea>

    <label class="f-lb" for="f-e">英译${cnt("e", linesOf(d.e).length ? linesOf(d.e).length + " 行" : "未填",
      linesOf(d.e).length && linesOf(d.e).length !== nC)}</label>
    <textarea class="f-tx" id="f-e" data-f="e" placeholder="每行对应一句的英文，点词能查词典">${esc(d.e)}</textarea>

    <p class="f-err" id="f-err"></p>
    <div style="height:8px"></div>
  </div>`;
}

/** 表单不参与全量重绘：render() 一跑 textarea 里的内容就没了。
 *  所以输入只写进 CUSTOM_DRAFT，并就地更新行数提示。 */
function bindCustomForm() {
  for (const el of app.querySelectorAll("[data-f]")) {
    el.addEventListener("input", () => {
      CUSTOM_DRAFT[el.dataset.f] = el.value;
      refreshCounts();
    });
  }
}

function refreshCounts() {
  const d = CUSTOM_DRAFT;
  const nC = linesOf(d.c).length;
  const put = (k, txt, bad) => {
    const n = app.querySelector('[data-n="' + k + '"]');
    if (!n) return;
    n.textContent = txt;
    n.classList.toggle("bad", !!bad);
  };
  put("c", nC + " 句", false);
  for (const k of ["m", "e"]) {
    const n = linesOf(d[k]).length;
    put(k, n ? n + " 行" : "未填", n && n !== nC);
  }
  const err = app.querySelector("#f-err");
  if (err) err.textContent = "";
}

function failCustom(msg) {
  const el = app.querySelector("#f-err");
  if (el) { el.textContent = msg; el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  toast(msg);
}

function saveCustom() {
  const d = CUSTOM_DRAFT || {};
  const t = (d.t || "").trim();
  if (!t) return failCustom("篇名还没填");
  if (WORKS.some(w => w.t === t && w.t !== CUSTOM_EDIT_T))
    return failCustom(`「${t}」已经在目录里了，换个名字`);

  const cs = linesOf(d.c);
  if (!cs.length) return failCustom("原文是空的");
  if (cs.length > 400) return failCustom(`这篇 ${cs.length} 句，太多了，本机篇目最多 400 句`);

  const ms = linesOf(d.m), es = linesOf(d.e);
  if (ms.length && ms.length !== cs.length)
    return failCustom(`白话 ${ms.length} 行、原文 ${cs.length} 句，对不上`);
  if (es.length && es.length !== cs.length)
    return failCustom(`英译 ${es.length} 行、原文 ${cs.length} 句，对不上`);
  const half = es.findIndex(x => /[\u4e00-\u9fa5]/.test(x));
  if (half >= 0) return failCustom(`第 ${half + 1} 句英译里还有中文，像是没译完`);

  const spec = {
    id: d.id || Date.now().toString(36),
    t, a: (d.a || "").trim(),
    ps: paraCounts(d.c),
    s: cs.map((c, i) => ({ c, m: ms[i] || "", e: (es[i] || "").trim() })),
  };

  const idx = CUSTOM_SPECS.findIndex(x => x.id === spec.id);
  if (idx >= 0) CUSTOM_SPECS[idx] = spec; else CUSTOM_SPECS.push(spec);
  saveCustomSpecs(CUSTOM_SPECS);

  const editing = !!CUSTOM_EDIT_T;
  if (editing) detachWork(CUSTOM_EDIT_T, true);   // true = 保留这篇的刷题记录
  attachWork(specToWork(spec));

  CUSTOM_SCREEN = null; CUSTOM_DRAFT = null; CUSTOM_EDIT_T = null;
  TAB = "catalog"; WORK = spec.t; WMODE = "read";
  render();
  toast(editing ? "已保存" : "已加入目录");
}

/* Tab 栏 */
function renderTabbar() {
  // 用线性 SVG 而不是 emoji：emoji 会被系统渲染成彩色贴图，
  // 和这套墨色/纸色的视觉不在一个调上，且不同手机长得不一样。
  const book = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5z"/>
      <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H19"/></svg>`;
  const list = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6.5h16M4 12h16M4 17.5h11"/></svg>`;
  const flag = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6.5 3h11v18l-5.5-3.6L6.5 21z"/></svg>`;
  const tabs = [["home", book, "今日"]];
  if (WORKS.length) tabs.push(["catalog", list, "篇目"]);
  tabs.push(["mistakes", flag, "错题本"]);
  return `<div class="tabbar">${tabs.map(([v, ic, label]) =>
    `<button class="${TAB === v ? "on" : ""}" data-act="tab" data-v="${v}">${ic}<span>${label}</span></button>`
  ).join("")}</div>`;
}

/* 弹层（首页 ⋯ 菜单 / 错题本筛选 / 退出确认） */
function renderSheet() {
  if (SHEET.type === "menu") {
    const t = S.theme;
    return `<div class="sheet-mask"><div class="sheet">
      <h4>外观</h4>
      <button data-act="theme" data-v="auto">跟随系统 ${t === "auto" ? "✓" : ""}</button>
      <button data-act="theme" data-v="light">浅色 ${t === "light" ? "✓" : ""}</button>
      <button data-act="theme" data-v="dark">深色 ${t === "dark" ? "✓" : ""}</button>
      <h4>发音（点单词卡片上的喇叭）</h4>
      <button data-act="saymode" data-v="auto">真人音 ${S.say === "auto" ? "✓" : ""}</button>
      <button data-act="saymode" data-v="tts">机器音 ${S.say === "tts" ? "✓" : ""}</button>
      <h4>数据</h4>
      <button class="danger" data-act="clear">清除全部学习记录</button>
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  if (SHEET.type === "confirmClear") {
    return `<div class="sheet-mask"><div class="sheet">
      <h4>清除全部学习记录？</h4>
      <p style="margin:0 20px 10px;font-size:13px;color:var(--text-2)">
        所有卡片的状态将回到「新卡」，错题本同时清空，此操作不可恢复。</p>
      <button class="danger" data-act="doclear">清除</button>
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  if (SHEET.type === "confirmExit") {
    return `<div class="sheet-mask"><div class="sheet">
      <h4>退出本轮？</h4>
      <p style="margin:0 20px 10px;font-size:13px;color:var(--text-2)">
        已作答题目的计数会保留，本轮剩余题目不再进行。</p>
      <button class="danger" data-act="doexit">退出</button>
      <button class="cancel" data-act="closesheet">继续做题</button>
    </div></div>`;
  }
  if (SHEET.type === "filter") {
    const works = [...new Set(S.mistakes.map(e => workName(BY_ID.get(e.id) || "")))].filter(Boolean);
    return `<div class="sheet-mask"><div class="sheet">
      <h4>按篇目筛选</h4>
      <button data-act="dofilter" data-v="">全部 ${FILTER_WORK ? "" : "✓"}</button>
      ${works.map(w => `<button data-act="dofilter" data-v="${esc(w)}">${esc(w)} ${FILTER_WORK === w ? "✓" : ""}</button>`).join("")}
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  // 句详情：点整篇原文里的某一句就弹它
  if (SHEET.type === "sent") {
    const w = WORK_BY_NAME.get(SHEET.w);
    const s = w && w.s[SHEET.i];
    if (!s) return "";
    const blk = w.m[s.m] || ["", 0];
    const words = (s.w || []).map(id => BY_ID.get(id)).filter(Boolean);
    const hasQ = words.length > 0 || !!s.q;
    return `<div class="sheet-mask"><div class="sheet">
      <h4>第 ${SHEET.i + 1} 句 · ${blk[1] ? "本段白话" : "本句白话"}</h4>
      <div class="sheet-body">
        <p class="sd-cl">${esc(s.c)}</p>
        <p>${esc(blk[0] || "")}</p>
        ${s.e ? `<div class="sd-k">英译</div><div class="sd-en">${wrapWords(s.e, [])}</div>` : ""}
        ${words.length ? `<div class="sd-k">本句可考的词</div>
          <p style="font-size:14px;color:var(--text-2)">${words.map(c => esc(c.tm)).join("、")}</p>` : ""}
      </div>
      ${hasQ ? `<button data-act="wsent" data-i="${SHEET.i}">单练这句</button>` : ""}
      <button class="cancel" data-act="closesheet">关闭</button>
    </div></div>`;
  }
  // 改档
  if (SHEET.type === "lv") {
    const w = WORK_BY_NAME.get(SHEET.w);
    if (!w) return "";
    const cur = lvOf(w);
    return `<div class="sheet-mask"><div class="sheet">
      <h4>${esc(w.t)} 归到哪一档</h4>
      ${[1, 2, 3].map(lv => `<button data-act="setlv" data-v="${lv}">${LV_NAME[lv]} ${cur === lv ? "✓" : ""}</button>`).join("")}
      ${S.wlv[w.t] ? `<button data-act="setlv" data-v="0">恢复自动（${LV_NAME[w.lv]}）</button>` : ""}
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  // 本机篇目的「⋯」：只对自己加的篇目出现，内置 25 篇不给编辑入口
  if (SHEET.type === "workmenu") {
    const w = WORK_BY_NAME.get(SHEET.w);
    if (!w) return "";
    return `<div class="sheet-mask"><div class="sheet">
      <h4>${esc(w.t)}</h4>
      <button data-act="editcustom" data-w="${esc(w.t)}">编辑这篇</button>
      <button class="danger" data-act="delcustom" data-w="${esc(w.t)}">删除这篇</button>
      <button class="cancel" data-act="closesheet">取消</button>
    </div></div>`;
  }
  if (SHEET.type === "confirmDelWork") {
    return `<div class="sheet-mask"><div class="sheet">
      <h4>删除「${esc(SHEET.w)}」？</h4>
      <p style="margin:0 20px 10px;font-size:13px;color:var(--text-2)">
        这篇是你自己加的，只存在这台手机上。删除后原文、进度一起没了，无法恢复。</p>
      <button class="danger" data-act="docustomdel" data-w="${esc(SHEET.w)}">删除</button>
      <button class="cancel" data-act="closesheet">再想想</button>
    </div></div>`;
  }
  return "";
}

/* ══════════════════════════════════════════════════════════════
   交互
   ══════════════════════════════════════════════════════════════ */

document.addEventListener("click", ev => {
  // iOS 上第一次 speak 必须在用户手势里，否则后面所有朗读都会被静默吞掉
  if (window.speechSynthesis && !sayWarmed) {
    sayWarmed = true;
    try { window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch {}
    try {
      sayVoice = pickVoice();
      window.speechSynthesis.addEventListener("voiceschanged", () => { sayVoice = pickVoice(); });
    } catch {}
  }

  // 点在浮卡外面 → 只收卡，不再往下走业务动作。
  // 浮卡周围全是选项和「下一题」，若继续冒泡，用户想关卡会顺手答错题。
  if (TIP && !ev.target.closest(".gw-tip")) {
    const onWord = ev.target.closest('[data-act="word"]');
    closeTip();
    if (!onWord) return;
  }

  // 点弹层的遮罩空白处 = 关闭。判断条件必须是「点的就是遮罩本身」：
  // 早先是在遮罩上挂 data-act="closesheet" + 面板上挂 onclick="event.stopPropagation()"，
  // 结果面板把事件拦在冒泡路上，document 上的委托收不到 —— 弹层里的
  // 改档、换主题、切发音、清除记录、单练这句**全都点不动**，而且没有任何报错。
  if (ev.target.classList && ev.target.classList.contains("sheet-mask")) {
    SHEET = null; render(); return;
  }

  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;

  switch (act) {
    case "tab":
      TAB = el.dataset.v; FILTER_WORK = null; CUSTOM_SCREEN = null;   // 切 Tab 就放弃没保存的表单
      if (TAB === "catalog") WORK = null;   // 从 Tab 进目录要回到顶层，别停在上次那篇
      renderEnter(); break;

    case "sheet": SHEET = { type: "menu" }; render(); break;
    case "closesheet": SHEET = null; render(); break;

    case "word": openWordTip(el); break;
    case "say": say(el.dataset.w); break;
    case "star": toggleStar(el); break;

    case "saymode":
      S.say = el.dataset.v === "tts" ? "tts" : "auto"; save();
      SHEET = null; render(); break;

    case "theme":
      S.theme = el.dataset.v; save();
      applyTheme();
      SHEET = null; render(); break;

    case "clear": SHEET = { type: "confirmClear" }; render(); break;
    case "doclear":
      // wlv（篇目档位）是偏好，不是学习记录，清记录时留着
      S = { prog: {}, mistakes: [], ratio: S.ratio, theme: S.theme, wlv: S.wlv || {} };
      save(); SHEET = null; render(); break;

    case "ratio":
      S.ratio = parseFloat(el.dataset.v); save(); render(); break;

    case "start": {
      const { round, fillIDs } = pickRound(S.ratio);
      SESSION = newSession("normal", round, fillIDs);
      SCREEN = "quiz"; render(); break;
    }

    case "retrain": {
      const card = BY_ID.get(el.dataset.id);
      if (!card) return;
      SESSION = newSession("retrain", [card], new Set());
      SCREEN = "quiz"; render(); break;
    }

    case "pick": {
      if (SESSION.locked) return;              // U2：锁定后二次点击无效
      const card = curCard();
      SESSION.selected = el.dataset.t;
      SESSION.locked = true;
      // 点了就走，不再等。
      // 原先这里先 render() 显示选中态、再 setTimeout 400ms 进答案页，真机上
      // 的体感就是「点完选项要愣一下才动」。那个选中态只是为了给一次触摸反馈，
      // 但代价是每次答题都空等 0.4 秒 —— 一轮 20 题白等 8 秒。
      // 现在反馈交给答案页：被选的项立刻标成绿色或红色并带 ✓/✗，比选中态更明确。
      // 锁定标记仍然保留，防止连点时同一题被记两次分。
      const isCorrect = SESSION.selected === card.q.c;
      // 篇内刷题也要计入卡片状态，否则在「篇目」里刷了一晚上，首页的
      // 「学习中 / 已掌握」还是 0。错题再练仍然只记次数、不推进状态。
      const counts = SESSION.mode !== "retrain" && !SESSION.fillIDs.has(card.id);
      recordAnswer(card, isCorrect, counts);
      if (isCorrect) SESSION.right++;
      if (!isCorrect) SESSION.wrong.add(card.id);
      SESSION.locked = false;
      SCREEN = "answer";
      render();
      break;
    }

    case "next": {
      if (SESSION.mode === "retrain") { SESSION = null; SCREEN = null; render(); break; }
      if (SESSION.idx + 1 < SESSION.round.length) {
        SESSION.idx++;
        SESSION.selected = null;
        SESSION.locked = false;
        SCREEN = "quiz";
      } else {
        SCREEN = "summary";                     // 默写已删：20 题答完直接进小结
      }
      render(); break;
    }

    case "addbook": {
      const card = curCard();
      if (!S.mistakes.some(e => e.id === card.id)) {
        S.mistakes.unshift({ id: card.id, at: Date.now() });
        save();
      }
      toast("已加入错题本");
      render(); break;
    }

    case "exit": SHEET = { type: "confirmExit" }; render(); break;
    case "doexit": {
      // 中途退出一律回主界面。
      // 原先篇内刷题会退回「篇详情」，看着像没退出去；而篇详情本来就能再进，
      // 少那一步不会迷路，用户的预期就是「退回首页」。
      SESSION = null; SCREEN = null; SHEET = null; WORK = null; TAB = "home";
      render(); break;
    }

    case "ctx": el.classList.toggle("open"); break;

    case "filter": SHEET = { type: "filter" }; render(); break;
    case "dofilter": FILTER_WORK = el.dataset.v || null; SHEET = null; render(); break;

    case "undel": {
      S.mistakes = S.mistakes.filter(e => e.id !== el.dataset.id);
      save(); render(); break;
    }

    /* ── 篇章 ── */
    case "home":   // 小结页的「回首页」。必须连 SESSION 一起清，只切 TAB 会原样渲染回小结
      SESSION = null; SCREEN = null; SHEET = null; WORK = null; TAB = "home";
      render(); break;

    case "tocatalog": TAB = "catalog"; WORK = null; FILTER_WORK = null; renderEnter(); break;
    case "backcatalog": WORK = null; render(); break;
    case "openwork": WORK = el.dataset.w; WMODE = "read"; render(); break;
    case "wmode": WMODE = el.dataset.v; render(); break;

    case "sent": SHEET = { type: "sent", w: WORK, i: +el.dataset.i }; render(); break;

    case "wsent": {
      const w = WORK_BY_NAME.get(WORK);
      const s = w && w.s[+el.dataset.i];
      if (!s) return;
      const round = (s.w || []).map(id => BY_ID.get(id)).filter(Boolean);
      if (s.q && BY_ID.get(s.q)) round.push(BY_ID.get(s.q));
      if (!round.length) { toast("这句没有可练的题"); return; }
      SHEET = null;
      SESSION = newSession("work", round, new Set(), WORK);
      SCREEN = "quiz"; render(); break;
    }

    case "wstart": {
      const name = WORK;
      const { round, fillIDs } = buildWorkRound(name);
      if (!round.length) { toast("本篇暂无可练习题"); return; }
      SESSION = newSession("work", round, fillIDs, name);
      SCREEN = "quiz"; render(); break;
    }

    case "backwork": {
      const n = SESSION.work;
      SESSION = null; SCREEN = null; SHEET = null;
      TAB = "catalog"; WORK = n; WMODE = "read";
      render(); break;
    }

    /* ── 本机篇目 ── */
    case "newcustom": openCustomForm(null); break;
    case "cancelcustom":
      CUSTOM_SCREEN = null; CUSTOM_DRAFT = null; CUSTOM_EDIT_T = null;
      render(); break;
    case "savecustom": saveCustom(); break;

    case "workmenu": SHEET = { type: "workmenu", w: el.dataset.w }; render(); break;
    case "editcustom": {
      const spec = CUSTOM_SPECS.find(x => x.t === el.dataset.w);
      SHEET = null;
      if (!spec) { toast("这篇已经不在了"); render(); break; }
      openCustomForm(spec); break;
    }
    case "delcustom": SHEET = { type: "confirmDelWork", w: el.dataset.w }; render(); break;
    case "docustomdel": {
      const name = el.dataset.w;
      detachWork(name);
      const spec = CUSTOM_SPECS.findIndex(x => x.t === name);
      if (spec >= 0) CUSTOM_SPECS.splice(spec, 1);
      saveCustomSpecs(CUSTOM_SPECS);
      SHEET = null; WORK = null; WMODE = "read";
      render(); toast("已删除"); break;
    }

    case "lvsheet": SHEET = { type: "lv", w: el.dataset.w }; render(); break;    case "setlv": {
      const v = +el.dataset.v;
      if (v === 0) delete S.wlv[SHEET.w]; else S.wlv[SHEET.w] = v;
      save(); SHEET = null; render(); break;
    }

    // 兜底：SW 里漏了哪个分支，点下去就是「没反应」，而且界面上看不出为什么。
    // 有了这条，下次至少能在控制台看到漏了哪个 act。
    default:
      console.warn("[古文] 未处理的 data-act:", act, el);
  }
});

let toastTimer = null;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; $("#phone").appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1400);
}

/* 主题：auto 跟随系统，light/dark 强制 */
function applyTheme() {
  document.documentElement.dataset.theme = S.theme === "auto" ? "" : S.theme;
  if (S.theme === "auto") delete document.documentElement.dataset.theme;
}

/* 启动 */
applyTheme();
render();
console.log("[古文体验版] 卡片", CARDS.length, "数据版本 v" + DATA.v);

/* 滚动一律收卡：浮卡是绝对定位，页面一滚就和被点的词错位了。
   用 capture 是因为滚动事件不冒泡，只能在各滚动容器的捕获阶段拿到。 */
document.addEventListener("scroll", () => closeTip(), { capture: true, passive: true });

/* 离线缓存：仅 https 下注册（file:// 打开时浏览器不允许 SW，也没必要） */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      /* 注册失败不影响在线使用，只是没网时会白屏 */
    });
  });
}
</script>
